<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sharp Shooter: Alive Sandbox</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #f8fafc;
            --ui-bg: rgba(30, 41, 59, 0.9);
            --accent: #38bdf8;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; cursor: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; box-sizing: border-box;
        }
        .hud-top {
            display: flex; justify-content: center; align-items: flex-start; width: 100%; position: relative;
        }
        .player-info {
            background: var(--ui-bg); padding: 10px 15px; border-radius: 12px;
            border: 2px solid #334155; width: 220px; position: absolute; left: 20px;
        }
        .health-label {
            color: var(--text-color); font-weight: bold; margin-bottom: 5px;
            display: flex; justify-content: space-between;
        }
        .health-bar {
            height: 15px; background: #000000; border: 2px solid #ffffff; border-radius: 5px; 
            overflow: hidden; box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
        .health-fill { 
            height: 100%; transition: width 0.2s; 
            background: #ef4444; box-shadow: 0 0 10px #ef4444, inset 0 0 5px #ef4444; 
        }

        .instructions {
            text-align: center; color: rgba(248, 250, 252, 0.8); font-size: 14px;
            background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 8px;
            pointer-events: auto; border: 1px solid #334155;
        }

        /* Modals */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: auto; cursor: default;
        }
        .modal-title {
            color: white; font-size: 32px; font-weight: bold; margin-bottom: 20px;
            text-shadow: 0 0 10px var(--accent);
        }
        .cards-container {
            display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 900px;
        }
        .card {
            background: #1e293b; border: 2px solid #475569; border-radius: 12px;
            width: 160px; padding: 20px 10px; text-align: center; cursor: pointer;
            transition: transform 0.2s, border-color 0.2s; color: white;
        }
        .card:hover {
            transform: translateY(-10px); border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
        }
        .card-icon { font-size: 40px; margin-bottom: 10px; }
        .card-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; color: var(--accent); }
        .card-desc { font-size: 12px; color: #94a3b8; }
        
        .close-btn {
            background: transparent; color: white; border: 2px solid white; padding: 10px 20px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 30px;
        }
        .close-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="player-info">
                <div class="health-label"><span>PLAYER 1</span> <span id="hp-player">500</span></div>
                <div class="health-bar"><div class="health-fill" id="bar-player"></div></div>
            </div>
            <div class="instructions" id="instruct">
                <b>SANDBOX MODE</b><br>
                WASD / Arrows: Move & Double Jump<br>
                Click: Shoot<br>
                <b>B</b>: Shield Bubble<br>
                <b>U</b>: Open Upgrades Menu
            </div>
        </div>
    </div>

    <!-- Card Selection Modal -->
    <div class="modal-overlay" id="card-modal">
        <div class="modal-title" id="card-modal-title">SANDBOX: PICK AN UPGRADE</div>
        <div class="cards-container" id="cards-container"></div>
        <button class="close-btn" onclick="closeUpgrades()">BACK TO GAME</button>
    </div>

<script>
/**
 * SHARP SHOOTER: ALIVE SANDBOX
 * Organic Arena Formation, Solo Sandbox, On-Demand Upgrades
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;

// Game State
let frameCount = 0;
let shakeAmount = 0;
let gameState = 'PLAYING';
let targetPopulation = 6; // Dynamic population target

// Upgrades Library
const ALL_CARDS = [
    { id: 'homing', icon: '🎯', name: 'Homing', desc: 'Arrows steer intelligently toward your mouse cursor.' },
    { id: 'explosive', icon: '💥', name: 'Explosive', desc: 'Arrows explode on impact dealing area damage.' },
    { id: 'spray', icon: '🔱', name: 'Spray', desc: 'Fires 3 arrows at once in a spread.' },
    { id: 'poison', icon: '🧪', name: 'Poison', desc: 'Arrows leave a venomous trail.' },
    { id: 'grow', icon: '📈', name: 'Grow', desc: 'Arrows get massively larger the longer they fly.' },
    { id: 'quick', icon: '⚡', name: 'Quick Shot', desc: 'Significantly drastically your fire rate.' }
];

// Entities
let arrows = [];
let blocks = [];
let particles = [];
let stars = [];

// Player Actor
let player = { 
    x: 0, y: 0, w: 40, h: 40, vx: 0, vy: 0, hp: 500, maxHp: 500, isGrounded: false,
    jumpsLeft: 2, upgrades: [], shootCooldown: 0, shieldActive: 0, shieldCooldown: 0, effects: [], outOfBoundsCooldown: 0
};

// Input
const mouse = { x: 0, y: 0 };
const keys = {};

// Physics Constants
const GRAVITY = 0.5;
const JUMP = 12;
const ARROW_SPEED = 14;

// Audio System
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const SOUNDS = {
    shoot: () => playSynth({ type: 'triangle', freq1: 600, freq2: 300, duration: 0.1, vol: 0.1 }),
    hit: () => playSynth({ type: 'square', freq1: 200, freq2: 50, duration: 0.1, vol: 0.1 }),
    bounce: () => playSynth({ type: 'sine', freq1: 150, freq2: 600, duration: 0.3, vol: 0.2 }),
    explosion: () => { playSynth({ type: 'sawtooth', freq1: 150, freq2: 20, duration: 0.4, vol: 0.2 }); playNoise(0.3, 0.2); },
    shield: () => playSynth({ type: 'sine', freq1: 800, freq2: 400, duration: 0.2, vol: 0.1 }),
    death: () => { playSynth({ type: 'sawtooth', freq1: 100, freq2: 10, duration: 0.8, vol: 0.3 }); playNoise(0.8, 0.3); },
    damage: () => playSynth({ type: 'sawtooth', freq1: 300, freq2: 100, duration: 0.2, vol: 0.2 })
};

function playSynth({ type, freq1, freq2, duration, vol }) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playNoise(duration, vol) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const bufferSize = audioCtx.sampleRate * duration; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const gain = audioCtx.createGain(); gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1000;
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start();
}

let initialized = false;
function resize() {
    let oldWidth = width;
    let oldHeight = height;
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = width; canvas.height = height;
    
    stars = [];
    for(let i=0; i<150; i++) {
        stars.push({ x: Math.random() * width, y: Math.random() * height, size: Math.random() * 2, speed: 0.1 + Math.random() * 0.5 });
    }

    if(!initialized && width > 0) { 
        resetArena(); 
        initialized = true; 
    } else if (initialized && oldWidth > 0 && oldHeight > 0) {
        // Dynamically spread the arena elements when the window size changes!
        let scaleX = width / oldWidth;
        let scaleY = height / oldHeight;
        let towerWidth = width * 0.15;
        let towerHeight = height * 0.6;
        let towerY = height - towerHeight;

        player.x *= scaleX;
        player.y *= scaleY;
        
        for (let b of blocks) {
            if (b.state === 'STATIC') {
                if (b.x < oldWidth / 2) { // Resize Left Tower
                    b.w = towerWidth; b.h = towerHeight; b.y = towerY;
                } else { // Resize Right Tower
                    b.w = towerWidth; b.h = towerHeight; b.x = width - towerWidth; b.y = towerY;
                }
            } else if (b.state === 'ORGANIC') {
                // Instantly spread out the organic block anchors
                b.anchorX *= scaleX;
                b.anchorY *= scaleY;
                b.x *= scaleX;
                b.y *= scaleY;
            }
        }
    }
}
window.addEventListener('resize', resize);

function spawnJumpVFX(x, y, color) {
    SOUNDS.shoot(); 
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 30, y: y, vx: 0, vy: 2 + Math.random() * 5,
            life: 1.0, decay: 0.05, color: color, size: 2 + Math.random() * 2, isStripe: true
        });
    }
}

// Input Setup
window.addEventListener('keydown', (e) => { 
    if (e.repeat) return; 
    keys[e.key.toLowerCase()] = true; 
    
    // Shield
    if (e.key.toLowerCase() === 'b' && gameState === 'PLAYING' && player.shieldCooldown <= 0) {
        player.shieldActive = 90; 
        player.shieldCooldown = 300; 
        SOUNDS.shield();
        spawnParticles(player.x+player.w/2, player.y+player.h/2, '#a855f7', 20, 3);
    }

    // Double Jump
    if ((e.key.toLowerCase() === 'w' || e.key === ' ' || e.key === 'arrowup') && gameState === 'PLAYING') {
        if (player.jumpsLeft > 0) {
            player.vy = -JUMP; player.isGrounded = false;
            if (player.jumpsLeft < 2) spawnJumpVFX(player.x + player.w/2, player.y + player.h, '#38bdf8');
            player.jumpsLeft--;
        }
    }

    // Sandbox Upgrades Menu
    if (e.key.toLowerCase() === 'u') {
        if (gameState === 'PLAYING') triggerCardSelect();
        else if (gameState === 'CARD_SELECT') closeUpgrades();
    }
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

canvas.addEventListener('mousedown', (e) => {
    if (gameState !== 'PLAYING') return;
    if (player.shootCooldown > 0) return;
    
    let dx = e.clientX - (player.x + player.w/2);
    let dy = e.clientY - (player.y + player.h/2);
    let dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > 0) {
        fireProjectile(player, dx/dist, dy/dist);
        player.shootCooldown = player.upgrades.includes('quick') ? 10 : 35;
    }
});

function resetArena() {
    blocks = []; arrows = []; particles = [];
    
    let towerWidth = width * 0.15;
    let towerHeight = height * 0.6;
    let towerY = height - towerHeight;

    // Left Tower
    blocks.push({
        x: 0, y: towerY, w: towerWidth, h: towerHeight, angle: 0,
        targetScale: 1, scale: 1, state: 'STATIC',
        color: 'rgba(30, 58, 138, 0.4)', glow: '#38bdf8'
    });

    // Right Tower
    blocks.push({
        x: width - towerWidth, y: towerY, w: towerWidth, h: towerHeight, angle: 0,
        targetScale: 1, scale: 1, state: 'STATIC',
        color: 'rgba(127, 29, 29, 0.4)', glow: '#ef4444'
    });

    // Spawn Player on left tower
    player.x = towerWidth / 2 - player.w / 2; 
    player.y = towerY - player.h - 10; 
    player.vx = 0; player.vy = 0; player.hp = player.maxHp; 
    player.effects = []; player.shieldActive = 0; player.shieldCooldown = 0; player.outOfBoundsCooldown = 0; player.jumpsLeft = 2;

    // Calculate initial population based on screen size (Area)
    let basePop = Math.floor((width * height) / 120000) + 4;
    targetPopulation = Math.min(Math.max(basePop, 6), 25);

    // Generate Organic Alive Formation Blocks (Initial Spawn)
    for(let i=0; i<targetPopulation; i++) spawnOrganicBlock(true);
    
    updateScoreUI();
    gameState = 'PLAYING';
}

function handleDeath() {
    SOUNDS.death();
    spawnParticles(player.x+20, player.y+20, '#38bdf8', 100, 5);
    
    // Sandbox instantly respawns you
    let towerWidth = width * 0.15;
    player.x = towerWidth / 2 - player.w / 2; 
    player.y = (height - height * 0.6) - player.h - 10; 
    player.vx = 0; player.vy = 0; player.hp = player.maxHp;
    player.shieldActive = 90; // Respawn shield
    updateScoreUI();
}

function triggerCardSelect() {
    gameState = 'CARD_SELECT';
    
    document.getElementById('card-modal').style.display = 'flex';
    const container = document.getElementById('cards-container');
    container.innerHTML = '';

    // Show all available cards in Sandbox
    ALL_CARDS.forEach(card => {
        let el = document.createElement('div');
        el.className = 'card';
        // Highlight if already acquired
        if(player.upgrades.includes(card.id)) el.style.borderColor = '#22c55e';
        
        el.innerHTML = `<div class="card-icon">${card.icon}</div><div class="card-name">${card.name}</div><div class="card-desc">${card.desc}</div>`;
        el.onclick = () => {
            if(!player.upgrades.includes(card.id)) {
                player.upgrades.push(card.id);
                SOUNDS.hit();
            } else {
                // Toggle off
                player.upgrades = player.upgrades.filter(u => u !== card.id);
                SOUNDS.bounce();
            }
            triggerCardSelect(); // Refresh UI
        };
        container.appendChild(el);
    });
}

function closeUpgrades() {
    document.getElementById('card-modal').style.display = 'none';
    gameState = 'PLAYING';
}

// --- Physics & Mechanics ---

function pointInOBB(px, py, b) {
    const cx = b.x + b.w/2; const cy = b.y + b.h/2;
    const dx = px - cx; const dy = py - cy;
    const rx = dx * Math.cos(-b.angle) - dy * Math.sin(-b.angle);
    const ry = dx * Math.sin(-b.angle) + dy * Math.cos(-b.angle);
    return (rx > -b.w/2 && rx < b.w/2 && ry > -b.h/2 && ry < b.h/2);
}

function fireProjectile(actor, dirX, dirY) {
    SOUNDS.shoot();
    let upgs = actor.upgrades;
    let startX = actor.x + actor.w/2;
    let startY = actor.y + actor.h/2;

    const createArr = (vx, vy) => {
        arrows.push({
            x: startX, y: startY, vx: vx * ARROW_SPEED, vy: vy * ARROW_SPEED,
            upgrades: upgs, history: [], scale: 1, life: 300
        });
    };

    if (upgs.includes('spray')) {
        for(let i = -1; i <= 1; i++) {
            let angle = Math.atan2(dirY, dirX) + (i * 0.25);
            createArr(Math.cos(angle), Math.sin(angle));
        }
    } else {
        createArr(dirX, dirY);
    }
}

function spawnOrganicBlock(isInitial = false) {
    let w = 70 + Math.random() * 60; 
    let h = 20 + Math.random() * 20;
    let x, y;
    
    let minX = width * 0.20; 
    let maxX = width * 0.80; 
    let minY = height * 0.2; 
    let maxY = height * 0.8;

    if (isInitial) {
        // Spawn scattered inside the arena
        x = minX + Math.random() * (maxX - minX - w);
        y = minY + Math.random() * (maxY - minY - h);
    } else {
        // Spawn off-screen to "come in"
        let edge = Math.floor(Math.random() * 4);
        if (edge === 0) { x = minX + Math.random() * (maxX-minX); y = -h - 100; } // Top
        else if (edge === 1) { x = minX + Math.random() * (maxX-minX); y = height + 100; } // Bottom
        else if (edge === 2) { x = -w - 100; y = minY + Math.random() * (maxY-minY); } // Left
        else { x = width + 100; y = minY + Math.random() * (maxY-minY); } // Right
    }

    // Varied rotation behaviors
    let rotTypes = ['NONE', 'CONSTANT', 'ALTERNATING'];
    let rotType = rotTypes[Math.floor(Math.random() * rotTypes.length)];
    
    // Pick a general anchor point in the middle for them to orbit/flock toward
    let anchorX = minX + Math.random() * (maxX - minX - w);
    let anchorY = minY + Math.random() * (maxY - minY - h);

    let b = { 
        x: x, y: y, w: w, h: h, 
        angle: (Math.random() - 0.5), 
        targetScale: 1, scale: isInitial ? 1 : 0, 
        vx: 0, vy: 0, state: 'ORGANIC',
        anchorX: anchorX, anchorY: anchorY,
        rotationType: rotType,
        baseAngle: (Math.random() - 0.5),
        angleVelocity: (Math.random() > 0.5 ? 1 : -1) * (0.005 + Math.random() * 0.015),
        driftSpeedX: 0.002 + Math.random() * 0.008,
        driftSpeedY: 0.002 + Math.random() * 0.008,
        timeOffsetX: Math.random() * 1000,
        timeOffsetY: Math.random() * 1000,
        lifespan: 1200 + Math.random() * 3000, // 20 to 70 seconds before leaving
        leaving: false
    };

    // Removed the rigid overlap check! 
    // They will naturally push each other apart via soft-repulsion in the update loop.
    blocks.push(b);
}

function applyPhysics(actor) {
    actor.vy += GRAVITY;
    actor.x += actor.vx; actor.y += actor.vy;
    actor.isGrounded = false;

    if (actor.outOfBoundsCooldown > 0) actor.outOfBoundsCooldown--;

    if (actor.x < 0 || actor.x + actor.w > width || actor.y < 0 || actor.y + actor.h > height) {
        if (actor.outOfBoundsCooldown <= 0) {
            actor.hp -= 50;
            SOUNDS.damage();
            spawnParticles(actor.x+actor.w/2, actor.y+actor.h/2, '#ef4444', 40, 4);
            actor.outOfBoundsCooldown = 30; 
            
            let cx = width/2; let cy = height/2;
            let dx = cx - (actor.x + actor.w/2); let dy = cy - (actor.y + actor.h/2);
            let dist = Math.sqrt(dx*dx + dy*dy);
            actor.vx = (dx/dist) * 25; actor.vy = (dy/dist) * 25;
        }
    }

    const px = actor.x + actor.w/2; let py = actor.y + actor.h;
    for (let b of blocks) {
        if (b.scale < 0.5) continue;
        if (pointInOBB(px, py, b) && actor.vy >= 0) {
            while(pointInOBB(px, py, b) && py > 0) { py--; actor.y--; }
            actor.vy = 0; actor.isGrounded = true;
            // Transfer block velocity to player for smoother riding
            if(b.state === 'ORGANIC') {
                actor.x += b.vx;
                actor.y += b.vy;
            }
        }
    }

    if (actor.isGrounded) actor.jumpsLeft = 2;
}

function updateScoreUI() {
    document.getElementById('hp-player').innerText = Math.max(0, Math.floor(player.hp));
    document.getElementById('bar-player').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
}

function spawnParticles(x, y, color, count, speedMult = 1) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 5 * speedMult;
        particles.push({
            x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1.0, decay: 0.02 + Math.random() * 0.03, color: color, size: Math.random() * 4 + 2, isStripe: false
        });
    }
}

function updateActors() {
    if (gameState !== 'PLAYING') return;

    if (keys['a'] || keys['arrowleft']) player.vx -= 1.2;
    if (keys['d'] || keys['arrowright']) player.vx += 1.2;
    player.vx *= 0.8; 
    
    if (player.shootCooldown > 0) player.shootCooldown--;
    if (player.shieldActive > 0) player.shieldActive--;
    if (player.shieldCooldown > 0) player.shieldCooldown--;

    applyPhysics(player);

    const applyPoison = (actor) => {
        for(let i=actor.effects.length-1; i>=0; i--) {
            let e = actor.effects[i]; e.timer--;
            if(e.timer <= 0) {
                actor.hp -= 2; e.ticks--; e.timer = 30;
                spawnParticles(actor.x+actor.w/2, actor.y, '#22c55e', 5, 0.5);
                if(e.ticks <= 0) actor.effects.splice(i, 1);
            }
        }
    };
    applyPoison(player);

    if (player.hp <= 0) handleDeath();
    
    updateScoreUI();
}

function update() {
    frameCount++;
    
    if (shakeAmount > 0) { shakeAmount *= 0.9; if (shakeAmount < 0.5) shakeAmount = 0; }

    for (let s of stars) {
        s.y += s.speed;
        if (s.y > height) { s.y = 0; s.x = Math.random() * width; }
    }

    if (gameState === 'PLAYING') {
        // Change population periodically (every ~8 seconds) based on screen area
        if (frameCount % 480 === 0) {
            let basePop = Math.floor((width * height) / 120000) + 4; 
            basePop = Math.min(Math.max(basePop, 6), 25); // Cap between 6 and 25
            targetPopulation = basePop + Math.floor(Math.random() * 5) - 2; 
        }
        updateActors();
    }

    // ORGANIC ALIVE ARENA LOGIC
    let activeOrganicCount = 0;
    
    for (let i = blocks.length - 1; i >= 0; i--) {
        let b = blocks[i];
        
        if (b.scale < b.targetScale) b.scale += 0.05;

        if (gameState === 'PLAYING' && b.state === 'ORGANIC') {
            if (!b.leaving) activeOrganicCount++;
            
            // Lifespan & Leaving mechanism
            b.lifespan--;
            
            // Cull blocks dynamically if we exceed the target population
            if (activeOrganicCount > targetPopulation && !b.leaving && Math.random() < 0.01) {
                b.lifespan = 0; // Force to leave
            }

            if (b.lifespan <= 0 && !b.leaving) {
                b.leaving = true;
                // Pick a direction far off-screen to drift away
                b.anchorX = (Math.random() > 0.5 ? -400 : width + 400);
                b.anchorY = (Math.random() > 0.5 ? -400 : height + 400);
            }

            // Apply specific rotation behavior
            if (b.rotationType === 'CONSTANT') {
                b.angle += b.angleVelocity;
            } else if (b.rotationType === 'ALTERNATING') {
                b.angle = b.baseAngle + Math.sin(frameCount * 0.02 + b.timeOffsetX) * 0.4;
            } // 'NONE' stays perfectly level (angle = 0 handled loosely by just not changing it, assuming starts near 0)

            // Calculate organic target point
            let targetX = b.anchorX;
            let targetY = b.anchorY;
            
            if (!b.leaving) {
                // Wiggle around the anchor if staying in formation
                targetX += Math.sin(frameCount * b.driftSpeedX + b.timeOffsetX) * 120;
                targetY += Math.cos(frameCount * b.driftSpeedY + b.timeOffsetY) * 80;
            }
            
            // Soft steering towards target
            let dx = targetX - b.x;
            let dy = targetY - b.y;
            b.vx += dx * (b.leaving ? 0.0005 : 0.0015);
            b.vy += dy * (b.leaving ? 0.0005 : 0.0015);

            // Soft repulsion from other blocks to maintain beautiful spacing!
            for (let j = 0; j < blocks.length; j++) {
                if (i === j || blocks[j].state === 'STATIC') continue;
                let ob = blocks[j];
                let dist = Math.hypot((b.x+b.w/2) - (ob.x+ob.w/2), (b.y+b.h/2) - (ob.y+ob.h/2));
                let minDist = (b.w + ob.w)/2 + 35; // The desired padding between blocks
                
                if (dist < minDist && dist > 0) {
                    let force = (minDist - dist) * 0.005; // Repel strength
                    b.vx -= ((ob.x - b.x)/dist) * force;
                    b.vy -= ((ob.y - b.y)/dist) * force;
                }
            }

            // Smooth Friction
            b.vx *= 0.93;
            b.vy *= 0.93;

            b.x += b.vx;
            b.y += b.vy;

            // Remove completely if it has drifted way off-screen
            if (b.leaving && (b.x < -300 || b.x > width + 300 || b.y < -300 || b.y > height + 300)) {
                blocks.splice(i, 1);
            }
        }
    }

    // Continuously spawn new blocks drifting in if we dip below target population
    if (gameState === 'PLAYING' && activeOrganicCount < targetPopulation && frameCount % 60 === 0) {
        spawnOrganicBlock(false);
    }

    // Update Arrows
    for (let i = arrows.length - 1; i >= 0; i--) {
        let a = arrows[i];
        a.life--; if (a.life <= 0) { arrows.splice(i, 1); continue; }

        a.history.push({x: a.x, y: a.y});
        if (a.history.length > 15) a.history.shift();

        if (a.upgrades.includes('grow') && a.scale < 3) a.scale += 0.02;

        // Sandbox Homing: Tracks mouse cursor!
        if (a.upgrades.includes('homing') && gameState === 'PLAYING') {
            let tx = mouse.x - a.x;
            let ty = mouse.y - a.y;
            let dist = Math.sqrt(tx*tx + ty*ty);
            if (dist > 20) {
                a.vx += (tx/dist) * 1.5; a.vy += (ty/dist) * 1.5;
                let spd = Math.sqrt(a.vx*a.vx + a.vy*a.vy);
                a.vx = (a.vx/spd)*ARROW_SPEED; a.vy = (a.vy/spd)*ARROW_SPEED;
            }
        }

        a.x += a.vx; a.y += a.vy;

        if (a.y > height || a.x > width + 50 || a.x < -50) { arrows.splice(i, 1); continue; }

        let destroyed = false;

        for (let b of blocks) {
            if (b.scale < 0.5) continue;
            if (pointInOBB(a.x, a.y, b)) { destroyed = true; handleArrowImpact(a, a.x, a.y); break; }
        }

        if (destroyed) { arrows.splice(i, 1); continue; }

        // Sandbox: Damage player if arrow loops around
        if (a.x > player.x && a.x < player.x + player.w && a.y > player.y && a.y < player.y + player.h) {
            if(player.shieldActive > 0) {
                SOUNDS.hit(); spawnParticles(a.x, a.y, '#a855f7', 10, 2); destroyed = true;
            } else {
                handleArrowImpact(a, a.x, a.y, player); destroyed = true;
            }
        }

        if (destroyed) arrows.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += GRAVITY * 0.5;
        p.life -= p.decay; if (p.life <= 0) particles.splice(i, 1);
    }
}

function handleArrowImpact(arrow, x, y, hitActor) {
    let baseDamage = 15 * arrow.scale;
    
    if (arrow.upgrades.includes('explosive')) {
        SOUNDS.explosion(); shakeAmount = 15;
        spawnParticles(x, y, '#ef4444', 30, 3); spawnParticles(x, y, '#f59e0b', 20, 4);
        const blastRadius = 100 * arrow.scale;
        
        if (hitActor || (Math.hypot(x - (player.x+player.w/2), y - (player.y+player.h/2)) < blastRadius && player.shieldActive <= 0)) {
            player.hp -= baseDamage * 1.5; player.vx += (player.x+player.w/2 - x) * 0.1; SOUNDS.damage();
        }
    } else {
        SOUNDS.hit(); spawnParticles(x, y, '#e2e8f0', 10, 2);
        if (hitActor) {
            hitActor.hp -= baseDamage; hitActor.vx += arrow.vx * 0.1 * arrow.scale; hitActor.vy -= 2; SOUNDS.damage();
            spawnParticles(x, y, '#38bdf8', 15, 2);
            if (arrow.upgrades.includes('poison')) hitActor.effects.push({ type: 'poison', ticks: 4, timer: 30 });
        }
    }
}

// --- Rendering ---

function drawGeometricActor(actor, baseHex, midHex, lightHex) {
    if (actor.hp <= 0 && gameState === 'PLAYING') return;

    ctx.save(); ctx.translate(actor.x, actor.y);
    
    if (actor.shieldActive > 0) {
        ctx.beginPath(); ctx.arc(actor.w/2, actor.h/2, 40 + Math.sin(frameCount*0.2)*2, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(168, 85, 247, 0.3)'; ctx.fill();
        ctx.strokeStyle = '#d8b4fe'; ctx.lineWidth = 2; ctx.stroke();
    }

    ctx.fillStyle = baseHex; ctx.fillRect(0, 0, actor.w, actor.h);
    ctx.fillStyle = midHex; ctx.beginPath(); ctx.moveTo(0, actor.h); ctx.lineTo(actor.w/2, actor.h * 0.2); ctx.lineTo(actor.w, actor.h); ctx.fill();
    ctx.fillStyle = lightHex; ctx.save(); ctx.translate(actor.w/2, actor.h/2 + 5); ctx.rotate(Math.PI / 4); ctx.fillRect(-8, -8, 16, 16); ctx.restore();

    ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 10; ctx.shadowColor = '#ffffff';
    let lookDir = (mouse.x > actor.x + actor.w/2) ? 1 : -1;
    ctx.fillRect(actor.w/2 + lookDir*8 - 4, actor.h * 0.3, 8, 8);
    ctx.restore();
}

function draw() {
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, width, height);
    ctx.save();
    if (shakeAmount > 0) ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);

    ctx.fillStyle = '#ffffff';
    for(let s of stars) {
        ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.05 + s.x) * 0.5;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    for (let b of blocks) {
        if (b.scale < 0.01) continue;
        const bw = b.w * b.scale; const bh = b.h * b.scale;
        const cx = b.x + b.w/2; const cy = b.y + b.h/2;

        ctx.save(); ctx.translate(cx, cy); ctx.rotate(b.angle);
        
        ctx.fillStyle = b.color || '#000000'; 
        ctx.beginPath(); ctx.roundRect(-bw/2, -bh/2, bw, bh, 4); ctx.fill();
        
        if (b.glow) { ctx.shadowColor = b.glow; ctx.shadowBlur = 20; } 
        else { ctx.shadowBlur = 0; }

        ctx.strokeStyle = b.glow || '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.restore();
    }

    drawGeometricActor(player, '#1e40af', '#2563eb', '#60a5fa');

    for (let p of particles) {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        if (p.isStripe) {
            ctx.shadowBlur = 15; ctx.shadowColor = p.color;
            ctx.fillRect(p.x - p.size/2, p.y, p.size, p.size * 6);
            ctx.shadowBlur = 0;
        } else {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
    }
    ctx.globalAlpha = 1.0;

    for (let a of arrows) {
        const angle = Math.atan2(a.vy, a.vx);
        let trailColor = '#38bdf8';
        if(a.upgrades.includes('poison')) trailColor = '#22c55e';
        else if (a.upgrades.includes('explosive')) trailColor = '#f59e0b';

        if (a.history.length > 0) {
            ctx.beginPath(); ctx.strokeStyle = trailColor; ctx.lineWidth = 3 * a.scale; ctx.globalAlpha = 0.5;
            ctx.moveTo(a.history[0].x, a.history[0].y);
            for(let i=1; i<a.history.length; i++) ctx.lineTo(a.history[i].x, a.history[i].y);
            ctx.lineTo(a.x, a.y); ctx.stroke(); ctx.globalAlpha = 1.0;
        }

        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(angle); ctx.scale(a.scale, a.scale);
        
        let coreColor = '#1e3a8a'; let glowColor = '#38bdf8';
        if(a.upgrades.includes('poison')) { coreColor = '#14532d'; glowColor = '#4ade80'; }
        
        ctx.fillStyle = coreColor; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
        ctx.shadowBlur = 15; ctx.shadowColor = glowColor;

        ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-5, -4); ctx.lineTo(-5, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.rect(-15, -1, 10, 2); ctx.fill(); ctx.stroke();
        
        if(a.upgrades.includes('explosive')) {
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)'; ctx.shadowBlur = 0; 
            ctx.beginPath(); ctx.arc(0, 0, 8 + Math.sin(frameCount*0.5)*3, 0, Math.PI*2); ctx.stroke();
        }
        ctx.restore();
    }

    ctx.restore();

    if (gameState === 'PLAYING') {
        ctx.strokeStyle = player.shootCooldown > 0 ? '#ef4444' : '#38bdf8';
        ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI*2);
        ctx.moveTo(mouse.x - 12, mouse.y); ctx.lineTo(mouse.x + 12, mouse.y);
        ctx.moveTo(mouse.x, mouse.y - 12); ctx.lineTo(mouse.x, mouse.y + 12); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 2, 0, Math.PI*2); ctx.fill();
    }
}

function gameLoop() {
    update(); draw(); requestAnimationFrame(gameLoop);
}

resize(); gameLoop();

</script>
</body>
