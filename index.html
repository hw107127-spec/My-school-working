<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sharp Shooter: Alive Sandbox</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #f8fafc;
            --ui-bg: rgba(30, 41, 59, 0.9);
            --accent: #38bdf8;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; cursor: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; box-sizing: border-box;
        }
        .hud-top {
            display: flex; justify-content: center; align-items: flex-start; width: 100%; position: relative;
        }
        .player-info {
            background: var(--ui-bg); padding: 10px 15px; border-radius: 12px;
            border: 2px solid #334155; width: 220px; position: absolute; left: 20px;
        }
        .health-label {
            color: var(--text-color); font-weight: bold; margin-bottom: 5px;
            display: flex; justify-content: space-between;
        }
        .health-bar {
            height: 15px; background: #000000; border: 2px solid #ffffff; border-radius: 5px; 
            overflow: hidden; box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
        .health-fill { 
            height: 100%; transition: width 0.2s; 
            background: #ef4444; box-shadow: 0 0 10px #ef4444, inset 0 0 5px #ef4444; 
        }

        .instructions {
            text-align: center; color: rgba(248, 250, 252, 0.8); font-size: 14px;
            background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 8px;
            pointer-events: auto; border: 1px solid #334155;
        }
        #map-indicator {
            color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 2px;
        }

        /* Modals */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: auto; cursor: default;
        }
        .modal-title {
            color: white; font-size: 32px; font-weight: bold; margin-bottom: 20px;
            text-shadow: 0 0 10px var(--accent);
        }
        .cards-container {
            display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 900px;
        }
        .card {
            background: #1e293b; border: 2px solid #475569; border-radius: 12px;
            width: 160px; padding: 20px 10px; text-align: center; cursor: pointer;
            transition: transform 0.2s, border-color 0.2s; color: white;
        }
        .card:hover {
            transform: translateY(-10px); border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
        }
        .card-icon { font-size: 40px; margin-bottom: 10px; }
        .card-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; color: var(--accent); }
        .card-desc { font-size: 12px; color: #94a3b8; }
        
        .close-btn {
            background: transparent; color: white; border: 2px solid white; padding: 10px 20px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 30px;
        }
        .close-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="player-info">
                <div class="health-label"><span>PLAYER 1</span> <span id="hp-player">500</span></div>
                <div class="health-bar"><div class="health-fill" id="bar-player"></div></div>
            </div>
            <div class="instructions" id="instruct">
                <div id="map-indicator">MAP: FLOATING</div>
                WASD / Arrows: Move & Double Jump<br>
                Click: Shoot | <b>B</b>: Shield | <b>U</b>: Upgrades<br>
                <i>Fall off bottom = Death. Shield at bottom border to bounce!</i>
            </div>
        </div>
    </div>

    <!-- Card Selection Modal -->
    <div class="modal-overlay" id="card-modal">
        <div class="modal-title" id="card-modal-title">SANDBOX: PICK AN UPGRADE</div>
        <div class="cards-container" id="cards-container"></div>
        <button class="close-btn" onclick="closeUpgrades()">BACK TO GAME</button>
    </div>

<script>
/**
 * SHARP SHOOTER: ALIVE SANDBOX
 * Organic Arenas, Parallel Universes, Upside Down Physics
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;

// Game State
let frameCount = 0;
let shakeAmount = 0;
let gameState = 'PLAYING';
let targetPopulation = 6;

// Map System
const MAP_TYPES = ['FLOATING', 'BRIDGE', 'ORBITAL'];
let currentMapIndex = 0;
let currentMap = MAP_TYPES[currentMapIndex];

// Camera / Dimension State
let cameraAngle = 0;
let targetCameraAngle = 0;

// Upgrades Library
const ALL_CARDS = [
    { id: 'homing', icon: '🎯', name: 'Homing', desc: 'Arrows steer intelligently toward your cursor.' },
    { id: 'explosive', icon: '💥', name: 'Explosive', desc: 'Arrows explode on impact dealing area damage.' },
    { id: 'spray', icon: '🔱', name: 'Spray', desc: 'Fires 3 arrows at once in a spread.' },
    { id: 'poison', icon: '🧪', name: 'Poison', desc: 'Arrows leave a venomous trail.' },
    { id: 'grow', icon: '📈', name: 'Grow', desc: 'Arrows get massively larger the longer they fly.' },
    { id: 'quick', icon: '⚡', name: 'Quick Shot', desc: 'Significantly drastically your fire rate.' }
];

// Entities
let arrows = [];
let blocks = [];
let particles = [];
let stars = [];
let spores = [];

// Player Actor
let player = { 
    x: 0, y: 0, w: 24, h: 24, vx: 0, vy: 0, hp: 500, maxHp: 500, isGrounded: false,
    jumpsLeft: 2, upgrades: [], shootCooldown: 0, shieldActive: 0, shieldCooldown: 0, effects: [], outOfBoundsCooldown: 0,
    gravityDir: 1, flipCooldown: 0
};

// Input
const mouse = { x: 0, y: 0 };
let mappedMouse = { x: 0, y: 0 }; // World coordinates considering camera rotation
const keys = {};

// Physics Constants
const GRAVITY = 0.5;
const JUMP = 12;
const ARROW_SPEED = 14;

// Audio System
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const SOUNDS = {
    shoot: () => playSynth({ type: 'triangle', freq1: 600, freq2: 300, duration: 0.1, vol: 0.1 }),
    hit: () => playSynth({ type: 'square', freq1: 200, freq2: 50, duration: 0.1, vol: 0.1 }),
    bounce: () => playSynth({ type: 'sine', freq1: 150, freq2: 600, duration: 0.3, vol: 0.2 }),
    explosion: () => { playSynth({ type: 'sawtooth', freq1: 150, freq2: 20, duration: 0.4, vol: 0.2 }); playNoise(0.3, 0.2); },
    shield: () => playSynth({ type: 'sine', freq1: 800, freq2: 400, duration: 0.2, vol: 0.1 }),
    death: () => { playSynth({ type: 'sawtooth', freq1: 100, freq2: 10, duration: 0.8, vol: 0.3 }); playNoise(0.8, 0.3); },
    damage: () => playSynth({ type: 'sawtooth', freq1: 300, freq2: 100, duration: 0.2, vol: 0.2 })
};

function playSynth({ type, freq1, freq2, duration, vol }) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playNoise(duration, vol) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const bufferSize = audioCtx.sampleRate * duration; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const gain = audioCtx.createGain(); gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1000;
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start();
}

let initialized = false;
function resize() {
    let oldWidth = width; let oldHeight = height;
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = width; canvas.height = height;
    
    stars = []; spores = [];
    for(let i=0; i<150; i++) {
        stars.push({ x: Math.random() * width, y: Math.random() * height, size: Math.random() * 2, speed: 0.1 + Math.random() * 0.5 });
        spores.push({ x: Math.random() * width, y: Math.random() * height, size: Math.random() * 3, speed: -(0.2 + Math.random() * 1.5) });
    }

    if(!initialized && width > 0) { 
        resetArena(); 
        initialized = true; 
    } else if (initialized && oldWidth > 0 && oldHeight > 0) {
        resetArena(); // Rebuild map natively to fit new dimensions
    }
}
window.addEventListener('resize', resize);

function spawnJumpVFX(x, y, color, gSign) {
    SOUNDS.shoot(); 
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 30, y: y, vx: 0, vy: (2 + Math.random() * 5) * gSign,
            life: 1.0, decay: 0.05, color: color, size: 2 + Math.random() * 2, isStripe: true
        });
    }
}

// Input Setup
window.addEventListener('keydown', (e) => { 
    if (e.repeat) return; 
    keys[e.key.toLowerCase()] = true; 
    
    if (e.key.toLowerCase() === 'b' && gameState === 'PLAYING' && player.shieldCooldown <= 0) {
        player.shieldActive = 90; player.shieldCooldown = 300; 
        SOUNDS.shield(); spawnParticles(player.x+player.w/2, player.y+player.h/2, '#a855f7', 20, 3);
    }

    // Double Jump
    if ((e.key.toLowerCase() === 'w' || e.key === ' ' || e.key === 'arrowup') && gameState === 'PLAYING') {
        let gSign = player.gravityDir || 1;
        if (player.jumpsLeft > 0) {
            player.vy = -JUMP * gSign; player.isGrounded = false;
            if (player.jumpsLeft < 2) spawnJumpVFX(player.x + player.w/2, gSign === 1 ? player.y + player.h : player.y, '#38bdf8', gSign);
            player.jumpsLeft--;
        }
    }

    if (e.key.toLowerCase() === 'u') {
        if (gameState === 'PLAYING') triggerCardSelect();
        else if (gameState === 'CARD_SELECT') closeUpgrades();
    }
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

canvas.addEventListener('mousedown', (e) => {
    if (gameState !== 'PLAYING') return;
    if (player.shootCooldown > 0) return;
    
    let dx = mappedMouse.x - (player.x + player.w/2);
    let dy = mappedMouse.y - (player.y + player.h/2);
    let dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > 0) {
        fireProjectile(player, dx/dist, dy/dist);
        player.shootCooldown = player.upgrades.includes('quick') ? 10 : 35;
    }
});

function resetArena() {
    blocks = []; arrows = []; particles = [];
    document.getElementById('map-indicator').innerText = "MAP: " + currentMap;
    
    // Much smaller, capped tower width so they don't stretch excessively on ultrawide screens
    let towerWidth = Math.min(width * 0.08, 120); 
    let towerHeight = height * 0.7; // Slightly taller
    
    if (currentMap === 'FLOATING') {
        let towerY = height - towerHeight;
        blocks.push({ x: 0, y: towerY, w: towerWidth, h: towerHeight, angle: 0, targetScale: 1, scale: 1, state: 'STATIC', color: 'rgba(30, 58, 138, 0.4)', glow: '#38bdf8' });
        blocks.push({ x: width - towerWidth, y: towerY, w: towerWidth, h: towerHeight, angle: 0, targetScale: 1, scale: 1, state: 'STATIC', color: 'rgba(127, 29, 29, 0.4)', glow: '#ef4444' });
        
        player.x = towerWidth / 2 - player.w / 2; player.y = towerY - player.h - 10; 
        
        // Higher population cap since everything is smaller
        let basePop = Math.floor((width * height) / 100000) + 4;
        targetPopulation = Math.min(Math.max(basePop, 8), 25);
        for(let i=0; i<targetPopulation; i++) spawnOrganicBlock(true);
        
    } else if (currentMap === 'BRIDGE') {
        let towerY = height - towerHeight;
        blocks.push({ x: 0, y: towerY, w: towerWidth, h: towerHeight, angle: 0, targetScale: 1, scale: 1, state: 'STATIC', color: 'rgba(30, 58, 138, 0.4)', glow: '#38bdf8' });
        blocks.push({ x: width - towerWidth, y: towerY, w: towerWidth, h: towerHeight, angle: 0, targetScale: 1, scale: 1, state: 'STATIC', color: 'rgba(127, 29, 29, 0.4)', glow: '#ef4444' });
        
        // Ground Bridge dynamically flies in and connects perfectly with cool floating block styling!
        let bridgeStartX = towerWidth;
        let bridgeEndX = width - towerWidth;
        let currentX = bridgeStartX;
        
        while (currentX < bridgeEndX) {
            let w = 40 + Math.random() * 50; // Smaller bridge pieces
            if (currentX + w > bridgeEndX - 20) w = bridgeEndX - currentX; 
            
            let h = 20 + Math.random() * 20; 
            blocks.push({
                x: width/2 + (Math.random()-0.5)*400, y: -100 - Math.random()*300, 
                w: w, h: h, angle: (Math.random() - 0.5) * Math.PI, targetScale: 1, scale: 0, 
                vx: 0, vy: 0, state: 'ORGANIC', color: '#000000', glow: '#ffffff',
                isBridgePiece: true, bridgeTargetX: currentX, bridgeTargetY: height - 80, // Flat walking surface on top
                lifespan: Infinity, leaving: false
            });
            currentX += w;
        }
        
        player.x = towerWidth / 2 - player.w / 2; player.y = towerY - player.h - 10; 

    } else if (currentMap === 'ORBITAL') {
        // Mirrored Towers
        let midY = height / 2;
        let oTowerH = midY - 60; // Leave space for middle gap
        
        // Top Towers
        blocks.push({ x: 0, y: midY - 20 - oTowerH, w: towerWidth, h: oTowerH, angle: 0, targetScale: 1, scale: 1, state: 'STATIC', color: 'rgba(30, 58, 138, 0.4)', glow: '#38bdf8' });
        blocks.push({ x: width - towerWidth, y: midY - 20 - oTowerH, w: towerWidth, h: oTowerH, angle: 0, targetScale: 1, scale: 1, state: 'STATIC', color: 'rgba(30, 58, 138, 0.4)', glow: '#38bdf8' });
        // Bottom Towers (Upside Down)
        blocks.push({ x: 0, y: midY + 20, w: towerWidth, h: oTowerH, angle: 0, targetScale: 1, scale: 1, state: 'STATIC', color: 'rgba(127, 29, 29, 0.4)', glow: '#ef4444' });
        blocks.push({ x: width - towerWidth, y: midY + 20, w: towerWidth, h: oTowerH, angle: 0, targetScale: 1, scale: 1, state: 'STATIC', color: 'rgba(127, 29, 29, 0.4)', glow: '#ef4444' });

        // Middle Splitting Divider
        let gapSize = 400; // Much wider gap to fit the "massive space" feel
        let leftW = (width / 2) - (gapSize / 2);
        let rightX = (width / 2) + (gapSize / 2);
        let rightW = width - rightX;
        
        blocks.push({ x: 0, y: midY - 10, w: leftW, h: 20, angle: 0, targetScale: 1, scale: 1, state: 'STATIC', color: '#1e293b', glow: '#94a3b8' });
        blocks.push({ x: rightX, y: midY - 10, w: rightW, h: 20, angle: 0, targetScale: 1, scale: 1, state: 'STATIC', color: '#1e293b', glow: '#94a3b8' });

        // Spawn on the top-left divider near the tower
        player.x = towerWidth + 20; 
        player.y = midY - 10 - player.h - 10;
        
        // Orbital map now completely empty of organic floating blocks!
    }

    player.vx = 0; player.vy = 0; player.hp = player.maxHp; 
    player.effects = []; player.shieldActive = 0; player.shieldCooldown = 0; player.outOfBoundsCooldown = 0; player.jumpsLeft = 2;
    player.gravityDir = 1; player.flipCooldown = 0;
    cameraAngle = 0; targetCameraAngle = 0;

    updateScoreUI();
    gameState = 'PLAYING';
}

function handleDeath() {
    SOUNDS.death();
    spawnParticles(player.x+20, player.y+20, '#38bdf8', 100, 5);
    
    // Cycle Map!
    currentMapIndex = (currentMapIndex + 1) % MAP_TYPES.length;
    currentMap = MAP_TYPES[currentMapIndex];
    resetArena();
    
    player.shieldActive = 90; // Respawn shield
}

function triggerCardSelect() {
    gameState = 'CARD_SELECT';
    document.getElementById('card-modal').style.display = 'flex';
    const container = document.getElementById('cards-container');
    container.innerHTML = '';

    ALL_CARDS.forEach(card => {
        let el = document.createElement('div');
        el.className = 'card';
        if(player.upgrades.includes(card.id)) el.style.borderColor = '#22c55e';
        el.innerHTML = `<div class="card-icon">${card.icon}</div><div class="card-name">${card.name}</div><div class="card-desc">${card.desc}</div>`;
        el.onclick = () => {
            if(!player.upgrades.includes(card.id)) { player.upgrades.push(card.id); SOUNDS.hit(); } 
            else { player.upgrades = player.upgrades.filter(u => u !== card.id); SOUNDS.bounce(); }
            triggerCardSelect();
        };
        container.appendChild(el);
    });
}
function closeUpgrades() { document.getElementById('card-modal').style.display = 'none'; gameState = 'PLAYING'; }

// --- Physics & Mechanics ---
function pointInOBB(px, py, b) {
    const cx = b.x + b.w/2; const cy = b.y + b.h/2;
    const dx = px - cx; const dy = py - cy;
    const rx = dx * Math.cos(-b.angle) - dy * Math.sin(-b.angle);
    const ry = dx * Math.sin(-b.angle) + dy * Math.cos(-b.angle);
    return (rx > -b.w/2 && rx < b.w/2 && ry > -b.h/2 && ry < b.h/2);
}

function fireProjectile(actor, dirX, dirY) {
    SOUNDS.shoot();
    let startX = actor.x + actor.w/2; let startY = actor.y + actor.h/2;
    const createArr = (vx, vy) => { arrows.push({ x: startX, y: startY, vx: vx * ARROW_SPEED, vy: vy * ARROW_SPEED, upgrades: actor.upgrades, history: [], scale: 1, life: 300 }); };

    if (actor.upgrades.includes('spray')) {
        for(let i = -1; i <= 1; i++) {
            let angle = Math.atan2(dirY, dirX) + (i * 0.25);
            createArr(Math.cos(angle), Math.sin(angle));
        }
    } else { createArr(dirX, dirY); }
}

function spawnOrganicBlock(isInitial = false) {
    let w = 35 + Math.random() * 45; let h = 12 + Math.random() * 12; // Scaled down blocks
    let x, y, anchorX, anchorY;
    
    let minX = width * 0.20; let maxX = width * 0.80; 
    let minY = height * 0.2; let maxY = height * 0.8;
    if (currentMap === 'ORBITAL') maxY = height * 0.45 - h; // Keep out of upside-down!

    let attempts = 0; let validAnchor = false;
    
    while (!validAnchor && attempts < 50) {
        anchorX = minX + Math.random() * (maxX - minX - w); anchorY = minY + Math.random() * (maxY - minY - h);
        validAnchor = true;
        for (let ex of blocks) {
            if (ex.state === 'STATIC') continue;
            if (Math.hypot(anchorX - ex.anchorX, anchorY - ex.anchorY) < 100) { validAnchor = false; break; } // Tighter packing
        }
        attempts++;
    }

    if (isInitial) { x = anchorX; y = anchorY; } 
    else {
        let edge = Math.floor(Math.random() * 4);
        if (edge === 0) { x = minX + Math.random() * (maxX-minX); y = -h - 100; }
        else if (edge === 1) { x = minX + Math.random() * (maxX-minX); y = height + 100; }
        else if (edge === 2) { x = -w - 100; y = minY + Math.random() * (maxY-minY); }
        else { x = width + 100; y = minY + Math.random() * (maxY-minY); }
    }

    let rotTypes = ['NONE', 'CONSTANT', 'ALTERNATING'];
    blocks.push({ 
        x: x, y: y, w: w, h: h, angle: (Math.random() - 0.5), targetScale: 1, scale: isInitial ? 1 : 0, 
        vx: 0, vy: 0, state: 'ORGANIC', anchorX: anchorX, anchorY: anchorY, rotationType: rotTypes[Math.floor(Math.random() * rotTypes.length)],
        baseAngle: (Math.random() - 0.5), angleVelocity: (Math.random() > 0.5 ? 1 : -1) * (0.005 + Math.random() * 0.015),
        driftSpeedX: 0.002 + Math.random() * 0.008, driftSpeedY: 0.002 + Math.random() * 0.008,
        timeOffsetX: Math.random() * 1000, timeOffsetY: Math.random() * 1000, lifespan: 1200 + Math.random() * 3000, leaving: false
    });
}

function applyPhysics(actor) {
    let gSign = actor.gravityDir || 1;
    
    actor.vy += GRAVITY * gSign;
    actor.x += actor.vx; actor.y += actor.vy;
    actor.isGrounded = false;

    if (actor.outOfBoundsCooldown > 0) actor.outOfBoundsCooldown--;

    // Solid Invisible Barriers (Top and Sides)
    if (actor.x < 0) { actor.x = 0; actor.vx = 0; }
    if (actor.x + actor.w > width) { actor.x = width - actor.w; actor.vx = 0; }
    if (actor.y < 0) { actor.y = 0; actor.vy = 0; }
    
    // In Orbital, the physical bottom is the "top" of the upside-down sky.
    if (currentMap === 'ORBITAL' && actor.y + actor.h > height) {
        actor.y = height - actor.h; actor.vy = 0;
    }

    // Bottom Death Zone & Shield Bounce
    if (currentMap !== 'ORBITAL') {
        if (actor.y > height) {
            if (actor.shieldActive > 0 && actor.outOfBoundsCooldown <= 0) {
                SOUNDS.bounce();
                spawnParticles(actor.x + actor.w/2, actor.y + actor.h/2, '#a855f7', 20, 2);
                actor.outOfBoundsCooldown = 20; 
                actor.jumpsLeft = 2; 
                actor.vy = -10; // Bounce up slightly 
            } else if (actor.y > height + 200) {
                actor.hp = 0; // Death if fell too far into blast zone
            }
        }
    }

    let pFootY = gSign === 1 ? actor.y + actor.h : actor.y;
    let pCenterY = actor.y + actor.h/2;
    const pCenterX = actor.x + actor.w/2;

    for (let b of blocks) {
        if (b.scale < 0.5) continue;

        if (b.state === 'STATIC' && b.angle === 0) {
            // AABB Collision for solid walls and towers (Can't phase through them)
            if (actor.x < b.x + b.w && actor.x + actor.w > b.x && actor.y < b.y + b.h && actor.y + actor.h > b.y) {
                let overlapLeft = (actor.x + actor.w) - b.x;
                let overlapRight = (b.x + b.w) - actor.x;
                let overlapTop = (actor.y + actor.h) - b.y;
                let overlapBottom = (b.y + b.h) - actor.y;
                
                let min = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
                
                if (min === overlapTop) { actor.y -= overlapTop; actor.vy = 0; if(gSign===1) actor.isGrounded = true; }
                else if (min === overlapBottom) { actor.y += overlapBottom; actor.vy = 0; if(gSign===-1) actor.isGrounded = true;}
                else if (min === overlapLeft) { actor.x -= overlapLeft; actor.vx = 0; }
                else if (min === overlapRight) { actor.x += overlapRight; actor.vx = 0; }
            }
        } else {
            // One-Way Platform for floating blocks (Phase through bottom, land on top)
            if (actor.vy * gSign > 0 && pointInOBB(pCenterX, pFootY, b) && !pointInOBB(pCenterX, pCenterY, b)) {
                let py = pFootY;
                while(pointInOBB(pCenterX, py, b) && py > 0 && py < height) { py -= gSign; actor.y -= gSign; }
                actor.vy = 0; actor.isGrounded = true;
                if(b.state === 'ORGANIC') { actor.x += b.vx; actor.y += b.vy; }
            }
        }
    }

    if (actor.isGrounded) actor.jumpsLeft = 2;
}

function updateScoreUI() {
    document.getElementById('hp-player').innerText = Math.max(0, Math.floor(player.hp));
    document.getElementById('bar-player').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
}

function spawnParticles(x, y, color, count, speedMult = 1) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2; let speed = Math.random() * 5 * speedMult;
        particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.0, decay: 0.02 + Math.random() * 0.03, color: color, size: Math.random() * 4 + 2, isStripe: false });
    }
}

function updateActors() {
    if (gameState !== 'PLAYING') return;

    let moveDir = 0;
    if (keys['a'] || keys['arrowleft']) moveDir -= 1.2;
    if (keys['d'] || keys['arrowright']) moveDir += 1.2;
    
    // Invert horizontal controls when upside down so A/D always match screen left/right
    if (player.gravityDir === -1) moveDir *= -1;
    
    player.vx += moveDir;
    player.vx *= 0.8; 
    
    if (player.shootCooldown > 0) player.shootCooldown--;
    if (player.shieldActive > 0) player.shieldActive--;
    if (player.shieldCooldown > 0) player.shieldCooldown--;

    if (player.flipCooldown > 0) player.flipCooldown--;

    if (currentMap === 'ORBITAL') {
        if (player.y > height/2 && player.gravityDir === 1 && player.flipCooldown <= 0) {
            player.gravityDir = -1; 
            player.flipCooldown = 60; 
            player.vy = 16; // Levitate UP into the upside down sky
            SOUNDS.bounce();
        } else if (player.y < height/2 && player.gravityDir === -1 && player.flipCooldown <= 0) {
            player.gravityDir = 1; 
            player.flipCooldown = 60; 
            player.vy = -16; // Levitate UP into the normal sky
            SOUNDS.bounce();
        }
    } else {
        player.gravityDir = 1;
    }

    applyPhysics(player);

    for(let i=player.effects.length-1; i>=0; i--) {
        let e = player.effects[i]; e.timer--;
        if(e.timer <= 0) {
            player.hp -= 2; e.ticks--; e.timer = 30;
            spawnParticles(player.x+player.w/2, player.y, '#22c55e', 5, 0.5);
            if(e.ticks <= 0) player.effects.splice(i, 1);
        }
    }

    if (player.hp <= 0) handleDeath();
    updateScoreUI();
}

function update() {
    frameCount++;
    if (shakeAmount > 0) { shakeAmount *= 0.9; if (shakeAmount < 0.5) shakeAmount = 0; }

    // Orbital Upside Down Screen Flip Logic
    targetCameraAngle = (player.gravityDir === -1) ? Math.PI : 0;
    let diff = targetCameraAngle - cameraAngle;
    while(diff > Math.PI) diff -= Math.PI*2; while(diff < -Math.PI) diff += Math.PI*2;
    cameraAngle += diff * 0.1;

    // Calculate correctly mapped mouse position
    let mdx = mouse.x - width/2; let mdy = mouse.y - height/2;
    mappedMouse.x = width/2 + mdx * Math.cos(-cameraAngle) - mdy * Math.sin(-cameraAngle);
    mappedMouse.y = height/2 + mdx * Math.sin(-cameraAngle) + mdy * Math.cos(-cameraAngle);

    for (let s of stars) { s.y += s.speed; if (s.y > height) { s.y = 0; s.x = Math.random() * width; } }
    for (let s of spores) { s.y += s.speed; if (s.y < 0) { s.y = height; s.x = Math.random() * width; } }

    if (gameState === 'PLAYING') updateActors();

    let activeOrganicCount = 0;
    for (let i = blocks.length - 1; i >= 0; i--) {
        let b = blocks[i];
        if (b.scale < b.targetScale) b.scale += 0.05;
        if (gameState === 'PLAYING' && b.state === 'ORGANIC') {
            
            // Bridge pieces fly in and flawlessly snap together!
            if (b.isBridgePiece) {
                b.vx += (b.bridgeTargetX - b.x) * 0.05;
                b.vy += (b.bridgeTargetY - b.y) * 0.05;
                b.angle *= 0.9; 
                b.vx *= 0.85; b.vy *= 0.85;
                b.x += b.vx; b.y += b.vy;
                continue; 
            }

            if (!b.leaving) activeOrganicCount++;
            b.lifespan--;
            
            if (activeOrganicCount > targetPopulation && !b.leaving && Math.random() < 0.01) b.lifespan = 0;
            if (b.lifespan <= 0 && !b.leaving) {
                b.leaving = true; b.anchorX = (Math.random() > 0.5 ? -400 : width + 400); b.anchorY = (Math.random() > 0.5 ? -400 : height + 400);
            }

            if (b.rotationType === 'CONSTANT') b.angle += b.angleVelocity;
            else if (b.rotationType === 'ALTERNATING') b.angle = b.baseAngle + Math.sin(frameCount * 0.02 + b.timeOffsetX) * 0.4;

            let targetX = b.anchorX; let targetY = b.anchorY;
            if (!b.leaving) {
                targetX += Math.sin(frameCount * b.driftSpeedX + b.timeOffsetX) * 120;
                targetY += Math.cos(frameCount * b.driftSpeedY + b.timeOffsetY) * 80;
            }

            if (currentMap === 'ORBITAL' && targetY > height * 0.45 - b.h) {
                targetY = height * 0.45 - b.h; // Prevent wandering into bottom half
            }
            
            b.vx += (targetX - b.x) * (b.leaving ? 0.0005 : 0.0015);
            b.vy += (targetY - b.y) * (b.leaving ? 0.0005 : 0.0015);

            for (let j = 0; j < blocks.length; j++) {
                if (i === j || blocks[j].state === 'STATIC') continue;
                let ob = blocks[j];
                let dist = Math.hypot((b.x+b.w/2) - (ob.x+ob.w/2), (b.y+b.h/2) - (ob.y+ob.h/2));
                let minDist = (b.w + ob.w)/2 + 50; // Scaled down repulsion radius
                if (dist < minDist && dist > 0) {
                    let force = (minDist - dist) * 0.015; 
                    b.vx -= ((ob.x - b.x)/dist) * force; b.vy -= ((ob.y - b.y)/dist) * force;
                }
            }

            b.vx *= 0.93; b.vy *= 0.93; b.x += b.vx; b.y += b.vy;
            if (b.leaving && (b.x < -300 || b.x > width + 300 || b.y < -300 || b.y > height + 300)) blocks.splice(i, 1);
        }
    }

    if (gameState === 'PLAYING' && currentMap === 'FLOATING' && activeOrganicCount < targetPopulation && frameCount % 60 === 0) spawnOrganicBlock(false);

    for (let i = arrows.length - 1; i >= 0; i--) {
        let a = arrows[i];
        a.life--; if (a.life <= 0) { arrows.splice(i, 1); continue; }
        a.history.push({x: a.x, y: a.y}); if (a.history.length > 15) a.history.shift();
        if (a.upgrades.includes('grow') && a.scale < 3) a.scale += 0.02;

        if (a.upgrades.includes('homing') && gameState === 'PLAYING') {
            let tx = mappedMouse.x - a.x; let ty = mappedMouse.y - a.y;
            let dist = Math.sqrt(tx*tx + ty*ty);
            if (dist > 20) {
                a.vx += (tx/dist) * 1.5; a.vy += (ty/dist) * 1.5;
                let spd = Math.sqrt(a.vx*a.vx + a.vy*a.vy);
                a.vx = (a.vx/spd)*ARROW_SPEED; a.vy = (a.vy/spd)*ARROW_SPEED;
            }
        }

        a.x += a.vx; a.y += a.vy;
        
        // Allow arrows to fly into the blast zone before disappearing
        if (a.y > height + 200 || a.y < -200 || a.x > width + 200 || a.x < -200) { arrows.splice(i, 1); continue; }

        let destroyed = false;
        for (let b of blocks) {
            if (b.scale < 0.5) continue;
            if (pointInOBB(a.x, a.y, b)) { 
                destroyed = true; 
                handleArrowImpact(a, a.x, a.y); break; 
            }
        }

        if (destroyed) { arrows.splice(i, 1); continue; }

        if (a.x > player.x && a.x < player.x + player.w && a.y > player.y && a.y < player.y + player.h) {
            if(player.shieldActive > 0) { SOUNDS.hit(); spawnParticles(a.x, a.y, '#a855f7', 10, 2); } 
            else { handleArrowImpact(a, a.x, a.y, player); }
            destroyed = true;
        }

        if (destroyed) arrows.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        let pSign = (currentMap === 'ORBITAL' && p.y > height/2) ? -1 : 1; 
        p.x += p.vx; p.y += p.vy; p.vy += GRAVITY * 0.5 * pSign;
        p.life -= p.decay; if (p.life <= 0) particles.splice(i, 1);
    }
}

function handleArrowImpact(arrow, x, y, hitActor) {
    let baseDamage = 15 * arrow.scale;
    if (arrow.upgrades.includes('explosive')) {
        SOUNDS.explosion(); shakeAmount = 15;
        spawnParticles(x, y, '#ef4444', 30, 3); spawnParticles(x, y, '#f59e0b', 20, 4);
        const blastRadius = 70 * arrow.scale; // Reduced blast radius for smaller scale
        
        if (hitActor || (Math.hypot(x - (player.x+player.w/2), y - (player.y+player.h/2)) < blastRadius && player.shieldActive <= 0)) {
            player.hp -= baseDamage * 1.5; player.vx += (player.x+player.w/2 - x) * 0.1; SOUNDS.damage();
        }
    } else {
        SOUNDS.hit(); spawnParticles(x, y, '#e2e8f0', 10, 2);
        if (hitActor) {
            hitActor.hp -= baseDamage; hitActor.vx += arrow.vx * 0.1 * arrow.scale; hitActor.vy -= 2; SOUNDS.damage();
            spawnParticles(x, y, '#38bdf8', 15, 2);
            if (arrow.upgrades.includes('poison')) hitActor.effects.push({ type: 'poison', ticks: 4, timer: 30 });
        }
    }
}

// --- Rendering ---
function drawGeometricActor(actor, baseHex, midHex, lightHex) {
    if (actor.hp <= 0 && gameState === 'PLAYING') return;

    ctx.save(); ctx.translate(actor.x, actor.y);
    if (actor.shieldActive > 0) {
        ctx.beginPath(); ctx.arc(actor.w/2, actor.h/2, actor.w*0.8 + Math.sin(frameCount*0.2)*2, 0, Math.PI*2); // Scales with actor
        ctx.fillStyle = 'rgba(168, 85, 247, 0.3)'; ctx.fill(); ctx.strokeStyle = '#d8b4fe'; ctx.lineWidth = 2; ctx.stroke();
    }

    ctx.fillStyle = baseHex; ctx.fillRect(0, 0, actor.w, actor.h);
    
    // Rotate internal graphics if upside down
    if (currentMap === 'ORBITAL' && actor.gravityDir === -1) { ctx.translate(actor.w/2, actor.h/2); ctx.rotate(Math.PI); ctx.translate(-actor.w/2, -actor.h/2); }

    ctx.fillStyle = midHex; ctx.beginPath(); ctx.moveTo(0, actor.h); ctx.lineTo(actor.w/2, actor.h * 0.2); ctx.lineTo(actor.w, actor.h); ctx.fill();
    ctx.fillStyle = lightHex; ctx.save(); ctx.translate(actor.w/2, actor.h/2 + Math.max(2, actor.h*0.1)); ctx.rotate(Math.PI / 4); ctx.fillRect(-actor.w*0.2, -actor.h*0.2, actor.w*0.4, actor.h*0.4); ctx.restore();

    ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 10; ctx.shadowColor = '#ffffff';
    let lookDir = (mappedMouse.x > actor.x + actor.w/2) ? 1 : -1;
    ctx.fillRect(actor.w/2 + lookDir*(actor.w*0.2) - (actor.w*0.1), actor.h * 0.3, actor.w*0.2, actor.h*0.2);
    ctx.restore();
}

function draw() {
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, width, height);
    ctx.save();
    
    if (shakeAmount > 0) ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);

    // Apply Camera Flip for Orbital Maps
    ctx.translate(width/2, height/2);
    ctx.rotate(cameraAngle);
    ctx.translate(-width/2, -height/2);

    // Draw Atmospheres
    if (currentMap === 'ORBITAL') {
        ctx.fillStyle = 'rgba(40, 0, 10, 0.5)';
        ctx.fillRect(0, height/2, width, height/2); // Upside Down Tint
        ctx.fillStyle = '#ffffff';
        for(let s of stars) { if(s.y < height/2) { ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.05 + s.x) * 0.5; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill(); } }
        ctx.fillStyle = '#ef4444'; ctx.globalAlpha = 0.6;
        for(let s of spores) { if(s.y > height/2) { ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill(); } }
    } else {
        ctx.fillStyle = '#ffffff';
        for(let s of stars) { ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.05 + s.x) * 0.5; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha = 1.0;

    for (let b of blocks) {
        if (b.scale < 0.01) continue;
        const bw = b.w * b.scale; const bh = b.h * b.scale;
        const cx = b.x + b.w/2; const cy = b.y + b.h/2;

        ctx.save(); ctx.translate(cx, cy); ctx.rotate(b.angle);
        ctx.fillStyle = b.color || '#000000'; ctx.beginPath(); ctx.roundRect(-bw/2, -bh/2, bw, bh, 4); ctx.fill();
        
        if (b.glow) { ctx.shadowColor = b.glow; ctx.shadowBlur = 20; } else { ctx.shadowBlur = 0; }
        ctx.strokeStyle = b.glow || '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.restore();
    }

    drawGeometricActor(player, '#1e40af', '#2563eb', '#60a5fa');

    for (let p of particles) {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        if (p.isStripe) {
            ctx.shadowBlur = 15; ctx.shadowColor = p.color; ctx.fillRect(p.x - p.size/2, p.y, p.size, p.size * 6); ctx.shadowBlur = 0;
        } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha = 1.0;

    for (let a of arrows) {
        const angle = Math.atan2(a.vy, a.vx);
        let trailColor = '#38bdf8';
        if(a.upgrades.includes('poison')) trailColor = '#22c55e'; else if (a.upgrades.includes('explosive')) trailColor = '#f59e0b';

        if (a.history.length > 0) {
            ctx.beginPath(); ctx.strokeStyle = trailColor; ctx.lineWidth = 3 * a.scale * 0.6; ctx.globalAlpha = 0.5;
            ctx.moveTo(a.history[0].x, a.history[0].y);
            for(let i=1; i<a.history.length; i++) ctx.lineTo(a.history[i].x, a.history[i].y);
            ctx.lineTo(a.x, a.y); ctx.stroke(); ctx.globalAlpha = 1.0;
        }

        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(angle); ctx.scale(a.scale * 0.6, a.scale * 0.6); // Shrink arrows globally
        
        let coreColor = '#1e3a8a'; let glowColor = '#38bdf8';
        if(a.upgrades.includes('poison')) { coreColor = '#14532d'; glowColor = '#4ade80'; }
        
        ctx.fillStyle = coreColor; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.shadowBlur = 15; ctx.shadowColor = glowColor;

        ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-5, -4); ctx.lineTo(-5, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.rect(-15, -1, 10, 2); ctx.fill(); ctx.stroke();
        
        if(a.upgrades.includes('explosive')) {
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)'; ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(0, 0, 8 + Math.sin(frameCount*0.5)*3, 0, Math.PI*2); ctx.stroke();
        }
        ctx.restore();
    }

    ctx.restore(); // Restore global camera rotation

    // UI Cursor (Always rendered unrotated over the screen)
    if (gameState === 'PLAYING') {
        ctx.strokeStyle = player.shootCooldown > 0 ? '#ef4444' : '#38bdf8';
        ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI*2);
        ctx.moveTo(mouse.x - 12, mouse.y); ctx.lineTo(mouse.x + 12, mouse.y);
        ctx.moveTo(mouse.x, mouse.y - 12); ctx.lineTo(mouse.x, mouse.y + 12); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 2, 0, Math.PI*2); ctx.fill();
    }
}

function gameLoop() {
    update(); draw(); requestAnimationFrame(gameLoop);
}

resize(); gameLoop();

</script>
