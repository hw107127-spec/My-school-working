<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cannon Legs Battle - Map Builder Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 1024px;
            height: 576px;
            background-color: #87CEEB;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            image-rendering: pixelated;
            transform-origin: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(26, 26, 46, 0.9);
            pointer-events: auto;
            z-index: 10;
        }

        .hidden { display: none !important; }

        h1 {
            font-size: 48px; color: #fca311;
            text-shadow: 4px 4px 0 #000;
            margin-bottom: 20px; text-align: center; line-height: 1.4;
        }

        button {
            padding: 15px 30px; margin: 10px;
            font-size: 24px; font-family: 'Press Start 2P', monospace;
            background-color: #e63946; color: white; border: 4px solid #fff;
            cursor: pointer; box-shadow: 4px 4px 0 #000; transition: transform 0.1s;
        }
        button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #000; }
        .btn-alt { background-color: #457b9d; }

        .instructions {
            margin-top: 40px; display: flex; gap: 50px;
            font-size: 12px; line-height: 1.8; text-align: center; color: #a8dadc;
        }

        .hud {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 40px; box-sizing: border-box;
        }

        .health-container { width: 300px; background: #000; border: 4px solid #fff; height: 30px; position: relative; }
        .health-bar { height: 100%; background: #e63946; transition: width 0.2s ease-out; }
        #p1-health { background: #e63946; transform-origin: left; }
        #p2-health { background: #457b9d; transform-origin: right; float: right;}

        .player-label { position: absolute; top: -25px; font-size: 16px; text-shadow: 2px 2px 0 #000; }
        #p1-label { left: 0; color: #e63946; }
        #p2-label { right: 0; color: #457b9d; }

        /* Map Editor Toolbar */
        #editor-toolbar {
            position: absolute; top: 0; left: 0; width: 100%; padding: 10px;
            background: rgba(0,0,0,0.85); pointer-events: auto;
            display: flex; gap: 15px; align-items: center; border-bottom: 2px solid #fff;
            box-sizing: border-box; font-size: 12px;
        }
        #editor-toolbar select, #editor-toolbar input {
            font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 5px;
        }
        #editor-toolbar button {
            font-size: 12px; padding: 10px; margin: 0; box-shadow: 2px 2px 0 #000;
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1024" height="576"></canvas>

    <div id="ui-layer">
        
        <!-- Editor Toolbar -->
        <div id="editor-toolbar" class="hidden">
            <span style="color: #fca311;">TOOL:</span>
            <select id="brush-type">
                <option value="solid">Solid Block</option>
                <option value="bouncy">Bouncy Pad</option>
                <option value="lava">Lava (Damage)</option>
                <option value="custom">Custom Code Block</option>
            </select>
            <input type="text" id="custom-props" class="hidden" placeholder='{"damage":10, "bounce":20, "color":"pink"}' style="width: 280px;">
            
            <span style="color: #a8dadc; margin-left: auto;">BG IMG:</span>
            <input type="file" id="bg-upload" accept="image/*" style="width: 150px;">
            
            <button id="editor-clear-btn" style="background: #e63946;">CLEAR</button>
            <button id="editor-play-btn" style="background: #2a9d8f;">PLAY MAP</button>
            <button id="editor-exit-btn" style="background: #555;">MENU</button>
        </div>

        <div class="hud hidden" id="hud">
            <div class="health-container">
                <div class="player-label" id="p1-label">PLAYER 1</div>
                <div class="health-bar" id="p1-health" style="width: 100%;"></div>
            </div>
            <div class="health-container">
                <div class="player-label" id="p2-label">PLAYER 2</div>
                <div class="health-bar" id="p2-health" style="width: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="screen">
        <h1>CANNON LEGS<br>BATTLE</h1>
        <div>
            <button id="start-btn">PLAY NORMAL</button>
            <button id="map-builder-btn" class="btn-alt">MAP BUILDER</button>
        </div>
        <div class="instructions">
            <div>
                <strong style="color: #e63946;">PLAYER 1</strong><br><br>
                Move: W A S D<br> Jump (x3): W<br> Glide: L-Shift<br> Dash: F<br>
                Shoot: Spacebar<br> <span style="color: #fca311;">Troll Ult: E</span>
            </div>
            <div>
                <strong style="color: #457b9d;">PLAYER 2</strong><br><br>
                Move: Arrows<br> Jump (x3): Up Arrow<br> Glide: R-Shift<br> Dash: /<br>
                Shoot: Enter<br> <span style="color: #00ffff;">Infinity: .</span>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="screen hidden">
        <h1 id="win-text">PLAYER WINS!</h1>
        <button id="rematch-btn">REMATCH</button>
        <button id="back-menu-btn" class="btn-alt">MAIN MENU</button>
    </div>
</div>

<script>
    /** * CANNON LEGS BATTLE - MAP BUILDER EDITION
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const mainMenu = document.getElementById('main-menu');
    const gameOverScreen = document.getElementById('game-over');
    const hud = document.getElementById('hud');
    const editorToolbar = document.getElementById('editor-toolbar');
    const startBtn = document.getElementById('start-btn');
    const mapBuilderBtn = document.getElementById('map-builder-btn');
    const rematchBtn = document.getElementById('rematch-btn');
    const backMenuBtn = document.getElementById('back-menu-btn');
    const editorPlayBtn = document.getElementById('editor-play-btn');
    const editorExitBtn = document.getElementById('editor-exit-btn');
    const editorClearBtn = document.getElementById('editor-clear-btn');
    const brushTypeSelect = document.getElementById('brush-type');
    const customPropsInput = document.getElementById('custom-props');
    const bgUploadInput = document.getElementById('bg-upload');
    const winText = document.getElementById('win-text');
    const p1HealthBar = document.getElementById('p1-health');
    const p2HealthBar = document.getElementById('p2-health');

    // Auto-Resize Game to Fit Screen
    function resizeGame() {
        const container = document.getElementById('game-container');
        // Calculate scale to fit window, multiplied by 0.98 to leave a tiny margin for the drop shadow
        const scale = Math.min(window.innerWidth / 1024, window.innerHeight / 576) * 0.98;
        container.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeGame);
    resizeGame();

    // Game Constants
    const GRAVITY = 0.6;
    const FLOOR_Y = 500;
    const MAX_HEALTH = 100;
    const GRID_SIZE = 32;
    let screenShake = 0;
    
    // Global Persistent Flags
    let p2IsPreppy = false;
    let p1HasXEyes = false;

    // State Variables
    let gameState = 'MENU'; // MENU, PLAYING, EDITOR, GAMEOVER
    let p1, p2;
    let projectiles = [];
    let particles = [];
    let damageTexts = [];

    // Map Engine Variables
    let mapBlocks = []; 
    let customBgImage = null;
    let isDrawing = false;
    let isErasing = false;

    // Input State
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    let spriteCacheFrames = [];
    let isSpriteLoaded = false;

    // ================== AUDIO SYSTEM ==================
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    function playRevSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(50, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 2); 
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.5);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2.1);
        osc.start(); osc.stop(audioCtx.currentTime + 2.2);
    }

    function playHornSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square'; osc2.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.5);
        osc2.frequency.setValueAtTime(410, audioCtx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(310, audioCtx.currentTime + 0.5);
        osc.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc2.start(); osc.stop(audioCtx.currentTime + 0.6); osc2.stop(audioCtx.currentTime + 0.6);
    }

    let targetTextPoints = [];
    function generateTextPoints() {
        const tc = document.createElement('canvas'); tc.width = 1000; tc.height = 300;
        const tCtx = tc.getContext('2d');
        tCtx.fillStyle = '#fff'; tCtx.font = '24px "Press Start 2P"'; tCtx.textAlign = 'center';
        tCtx.fillText("Jsus has saved you,", 512, 100);
        tCtx.fillText("be grate full.", 512, 150);
        const imgData = tCtx.getImageData(0, 0, 1000, 300).data;
        const pts = [];
        for(let y = 0; y < 300; y += 4) {
            for(let x = 0; x < 1000; x += 4) {
                if (imgData[(y * 1000 + x) * 4 + 3] > 128) pts.push({x: x, y: y + 50}); 
            }
        }
        return pts.sort(() => Math.random() - 0.5);
    }

    // ================== MAP BUILDER / COLLISION ENGINE ==================

    brushTypeSelect.addEventListener('change', (e) => {
        customPropsInput.style.display = e.target.value === 'custom' ? 'block' : 'none';
    });

    bgUploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                customBgImage = new Image();
                customBgImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    canvas.addEventListener('mousedown', (e) => {
        if (gameState !== 'EDITOR') return;
        if (e.button === 0) isDrawing = true;
        if (e.button === 2) isErasing = true;
        handleEditorMouse(e);
    });
    canvas.addEventListener('mousemove', (e) => {
        if (gameState === 'EDITOR' && (isDrawing || isErasing)) handleEditorMouse(e);
    });
    canvas.addEventListener('mouseup', () => { isDrawing = false; isErasing = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault()); // Prevent right click menu

    function handleEditorMouse(e) {
        const rect = canvas.getBoundingClientRect();
        // Calculate true coordinates based on CSS scaling
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;
        
        const gridX = Math.floor(mx / GRID_SIZE) * GRID_SIZE;
        const gridY = Math.floor(my / GRID_SIZE) * GRID_SIZE;

        // Remove existing block at this cell to prevent overlap
        mapBlocks = mapBlocks.filter(b => !(b.x === gridX && b.y === gridY));

        if (isDrawing) {
            let bType = brushTypeSelect.value;
            let customCode = null;
            if (bType === 'custom') {
                try { customCode = JSON.parse(customPropsInput.value || "{}"); } catch(e) {}
            }
            mapBlocks.push({ x: gridX, y: gridY, width: GRID_SIZE, height: GRID_SIZE, type: bType, props: customCode });
        }
    }

    // Resolves physics collisions against custom drawn blocks
    function resolveBlockCollisions(entity) {
        let isGrounded = false;
        
        for (let b of mapBlocks) {
            if (checkAABB(entity, b)) {
                // Calculate overlaps
                let overlapL = (entity.x + entity.width) - b.x;
                let overlapR = (b.x + b.width) - entity.x;
                let overlapT = (entity.y + entity.height) - b.y;
                let overlapB = (b.y + b.height) - entity.y;

                // Find smallest overlap to resolve
                let min = Math.min(overlapL, overlapR, overlapT, overlapB);

                // Handle AI Custom Props Triggers
                if (b.props) {
                    if (b.props.damage && entity.takeDamage && Math.random() < 0.1) entity.takeDamage(b.props.damage); // Tick damage
                    if (b.props.bounce && min === overlapT) entity.vy = -b.props.bounce;
                }
                
                // Specific Block Type Logic
                if (b.type === 'lava' && entity.takeDamage && Math.random() < 0.2) {
                    entity.takeDamage(10);
                    particles.push(new Particle(entity.x + entity.width/2, entity.y+entity.height, (Math.random()-0.5)*2, -Math.random()*4, '#ff4d4d', 10));
                }

                if (min === overlapT) { // Hit top
                    entity.y = b.y - entity.height;
                    entity.vy = 0;
                    isGrounded = true;
                    if (b.type === 'bouncy') entity.vy = -18;
                } else if (min === overlapB) { // Hit bottom
                    entity.y = b.y + b.height;
                    entity.vy = 0;
                } else if (min === overlapL) { // Hit left side
                    entity.x = b.x - entity.width;
                    entity.vx = 0;
                } else if (min === overlapR) { // Hit right side
                    entity.x = b.x + b.width;
                    entity.vx = 0;
                }
            }
        }
        return isGrounded;
    }

    function drawMapBlocks() {
        for (let b of mapBlocks) {
            if (b.type === 'solid') {
                ctx.fillStyle = '#4a4e69';
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = '#222';
                ctx.strokeRect(b.x, b.y, b.width, b.height);
            } else if (b.type === 'bouncy') {
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.fillStyle = '#ccffcc';
                ctx.fillRect(b.x, b.y, b.width, 5); // spring rim
            } else if (b.type === 'lava') {
                ctx.fillStyle = `hsl(${Math.random() * 20 + 10}, 100%, 50%)`; // bubbling lava
                ctx.fillRect(b.x, b.y, b.width, b.height);
            } else if (b.type === 'custom') {
                ctx.fillStyle = b.props?.color || '#d400ff'; // AI programmed block
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.fillStyle = '#fff'; ctx.font = '8px "Press Start 2P"';
                ctx.fillText("{ }", b.x + 5, b.y + 20);
            }
        }
    }


    // ================== P1 TROLL ULTIMATE MANAGER ==================
    const Ultimate = {
        active: false, phase: 0, timer: 0, text: "", player: null, target: null, whiteFade: 0, beamActive: false,
        start: function(player) {
            this.active = true; this.phase = 0; this.timer = 0; this.player = player;
            this.target = player === p1 ? p2 : p1;
            player.isDashing = false; player.dashCharge = 0; player.vx = 0; player.vy = 0;
            this.whiteFade = 0; this.beamActive = false; screenShake = 10;
        },
        update: function() {
            if (!this.active) return;
            this.timer++;

            if (this.phase >= 1 && this.phase <= 3 && this.timer % 2 === 0) {
                let angle = Math.random() * Math.PI * 2;
                let dist = 300 + Math.random() * 200;
                particles.push(new EssenceParticle(this.player.x + this.player.width/2 + Math.cos(angle)*dist, this.player.y + this.player.height/2 + Math.sin(angle)*dist, this.player));
            }

            if (this.phase === 0) {
                this.text = "Monday, June 1";
                if (this.timer > 90) { this.phase = 1; this.timer = 0; }
            } else if (this.phase === 1) {
                this.text = "Be proud..";
                if (this.timer > 90) { this.phase = 2; this.timer = 0; }
            } else if (this.phase === 2) {
                this.text = "You are gay..";
                if (this.timer > 90) { this.phase = 3; this.timer = 0; }
            } else if (this.phase === 3) {
                this.text = "Special technique...";
                if (this.timer > 110) { this.phase = 4; this.timer = 0; }
            } else if (this.phase === 4) {
                this.player.vy = 0; 
                if (this.timer > 120) { 
                    this.phase = 5; this.timer = 0; screenShake = 35; this.beamActive = true;
                    projectiles.push(new PrideBeam(this.player, this.target));
                }
            } else if (this.phase === 5) {
                if (this.timer === 240) playRevSound(); 
                if (this.timer > 240) this.whiteFade = Math.min(1, (this.timer - 240) / 120); 
                if (this.timer >= 360) { this.phase = 6; this.timer = 0; this.beamActive = false; }
            } else if (this.phase === 6) {
                this.target.hidden = true; 
                for(let i=0; i<150; i++) particles.push(new ExplosionConfetti(this.target.x + this.target.width/2, this.target.y + this.target.height/2));
                this.whiteFade = 0; this.phase = 7; this.timer = 0;
            } else if (this.phase === 7) {
                if (this.player.isGrounded) { this.phase = 8; this.timer = 0; }
            } else if (this.phase === 8) {
                this.player.rotation = -Math.PI / 4; 
                playHornSound();
                targetTextPoints = generateTextPoints();
                let mx = this.player.x + this.player.width/2 + 30; let my = this.player.y;
                targetTextPoints.forEach((pt, i) => { setTimeout(() => { particles.push(new TextConfetti(mx, my, pt)); }, i * 2); });
                this.phase = 9; this.timer = 0;
            } else if (this.phase === 9) {
                if (this.timer > 300) { this.phase = 10; this.timer = 0; }
            } else if (this.phase === 10) {
                p1HasXEyes = true;
                if (this.timer > 60) { p2IsPreppy = true; this.active = false; endGame("JUSTICE SERVED!"); }
            }

            if (this.phase < 5) { this.player.vy = -0.5; this.player.vx = 0; this.player.frameIndex = 5; }
        },
        draw: function(ctx) {
            if (!this.active) return;
            if (this.phase >= 0 && this.phase <= 3) {
                let grad = ctx.createLinearGradient(this.player.x - 50, 0, this.player.x + this.player.width + 50, 0);
                grad.addColorStop(0, 'rgba(255, 0, 0, 0.2)'); grad.addColorStop(0.2, 'rgba(255, 127, 0, 0.2)');
                grad.addColorStop(0.6, 'rgba(0, 255, 0, 0.2)'); grad.addColorStop(1, 'rgba(139, 0, 255, 0.2)');
                ctx.fillStyle = grad; ctx.fillRect(this.player.x - 50, 0, this.player.width + 100, canvas.height);
                ctx.fillStyle = `hsl(${this.timer * 5 + Date.now()/10}, 100%, 50%)`;
                ctx.font = '24px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
                ctx.fillText(this.text, this.player.x + this.player.width/2, this.player.y - 40); ctx.shadowBlur = 0; 
            }
            if (this.phase === 4) {
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = `hsl(${this.timer * 25}, 100%, 60%)`; ctx.font = `${40 + (this.timer/6)}px "Press Start 2P"`;
                ctx.textAlign = 'center'; ctx.fillText("PRIDE", canvas.width/2, canvas.height/2);
            }
            if (this.phase === 5 && this.whiteFade > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.whiteFade})`; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }
    };

    // ================== ENTITY CLASSES ==================
    class Player {
        constructor(x, y, isPlayer1) {
            this.x = x; this.y = y; this.vx = 0; this.vy = 0;
            this.width = 80; this.height = 80; this.speed = 3.5; this.jumpForce = -12;
            this.isGrounded = false; this.isPlayer1 = isPlayer1; this.direction = isPlayer1 ? 1 : -1;
            this.hp = MAX_HEALTH; this.hidden = false; this.hasFlag = !isPlayer1 && p2IsPreppy; this.rotation = 0; 
            
            this.jumpsLeft = 3; this.dashCharge = 0; this.isDashing = false; this.dashTimer = 0;
            this.prevDash = false; this.prevJump = false;

            this.infinityActive = false; this.infinityTimer = 0; this.infinityCooldown = 0;
            this.isCrushed = false; this.crushFactor = 1.0; this.crushDamageTick = 0;

            this.frameIndex = 0; this.animTimer = 0; this.cooldown = 0; this.maxCooldown = 40; 
        }

        update() {
            if (this.hidden) return;

            if (Ultimate.active) {
                if (this.isPlayer1 && Ultimate.phase < 7) { this.y += this.vy; return; }
                if (this.isPlayer1 && Ultimate.phase >= 7) {
                    this.vy += GRAVITY; this.y += this.vy;
                    let hitBlock = resolveBlockCollisions(this);
                    if (this.y + this.height > FLOOR_Y || hitBlock) {
                        if (this.y + this.height > FLOOR_Y) this.y = FLOOR_Y - this.height;
                        this.vy = 0; this.isGrounded = true;
                    }
                    return;
                }
            }

            if (this.isCrushed) { this.vx = 0; return; }

            if (this.cooldown > 0) this.cooldown--;
            if (this.infinityCooldown > 0) this.infinityCooldown--;

            const kUp = this.isPlayer1 ? 'KeyW' : 'ArrowUp'; const kLeft = this.isPlayer1 ? 'KeyA' : 'ArrowLeft';
            const kRight = this.isPlayer1 ? 'KeyD' : 'ArrowRight'; const kShoot = this.isPlayer1 ? 'Space' : 'Enter';
            const kDash = this.isPlayer1 ? 'KeyF' : 'Slash'; const kGlide = this.isPlayer1 ? 'ShiftLeft' : 'ShiftRight';
            const kUlt = 'KeyE'; const kInfinity = 'Period';

            if (this.isPlayer1 && keys[kUlt] && !Ultimate.active) { initAudio(); Ultimate.start(this); return; }
            if (!this.isPlayer1 && keys[kInfinity] && this.infinityCooldown <= 0 && !this.infinityActive) {
                this.infinityActive = true; this.infinityTimer = 180; this.infinityCooldown = 600; 
            }
            if (this.infinityActive) { this.infinityTimer--; if (this.infinityTimer <= 0) this.infinityActive = false; }

            let currentDash = keys[kDash]; let currentJump = keys[kUp];

            if (currentDash && !this.isDashing && this.isGrounded) { this.dashCharge++; this.vx = 0; 
            } else if (!currentDash && this.prevDash && this.dashCharge > 5) {
                this.isDashing = true; this.dashTimer = 12; this.dashCharge = 0; screenShake = 5;
            } else if (!currentDash) { this.dashCharge = 0; }

            if (this.isDashing) {
                this.vx = this.direction * 18; this.vy = 0; this.dashTimer--;
                if (this.dashTimer <= 0) this.isDashing = false;
            } else if (this.dashCharge === 0) {
                if (keys[kLeft]) { this.vx = -this.speed; this.direction = -1; }
                else if (keys[kRight]) { this.vx = this.speed; this.direction = 1; }
                else { this.vx = 0; }
            }

            if (currentJump && !this.prevJump && this.jumpsLeft > 0 && !this.isDashing) {
                this.vy = this.jumpForce; this.jumpsLeft--; this.isGrounded = false; this.dashCharge = 0;
                for(let i=0; i<5; i++) particles.push(new Particle(this.x + this.width/2, this.y + this.height, (Math.random()-0.5)*4, Math.random()*2, '#ddd'));
            }
            
            if (keys[kGlide] && this.vy > 0 && !this.isDashing) this.vy = 2; 
            if (keys[kShoot] && this.cooldown <= 0 && this.dashCharge === 0) { initAudio(); this.shoot(); }
            if (!this.isDashing) this.vy += GRAVITY;
            
            this.x += this.vx; this.y += this.vy;

            // RESOLVE COLLISIONS (Map Blocks & Floor/Walls)
            let blockGrounded = resolveBlockCollisions(this);

            if (this.y + this.height > FLOOR_Y) {
                this.y = FLOOR_Y - this.height; this.vy = 0; this.isGrounded = true; this.jumpsLeft = 3; 
            } else if (blockGrounded) {
                this.isGrounded = true; this.jumpsLeft = 3;
            }

            if (this.x < 0) this.x = 0;
            if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

            // ANIMATION
            if (this.dashCharge > 0) { this.frameIndex = 6; this.animTimer = 0;
            } else if (this.isDashing) {
                this.animTimer += 4; if (this.animTimer > 12) { this.frameIndex = (this.frameIndex + 1) % 4; this.animTimer = 0; }
            } else if (!this.isGrounded) {
                if (this.vy < -2) this.frameIndex = 4; else this.frameIndex = 5; this.animTimer = 0;
            } else if (Math.abs(this.vx) > 0.1) {
                this.animTimer++; if (this.animTimer > 12) { this.frameIndex = (this.frameIndex + 1) % 4; this.animTimer = 0; }
            } else { this.frameIndex = 0; this.animTimer = 0; }

            this.prevDash = currentDash; this.prevJump = currentJump;
        }

        shoot() {
            this.cooldown = this.maxCooldown;
            const muzzleX = this.x + (this.width / 2) + (this.direction * 40); const muzzleY = this.y + 20; 
            projectiles.push(new Cannonball(muzzleX, muzzleY, this.direction, this.isPlayer1));
            this.vx = -this.direction * 4;
            for(let i=0; i<10; i++) particles.push(new Particle(muzzleX, muzzleY, (Math.random() - 0.5) * 5 + (this.direction * 5), (Math.random() - 0.5) * 5, '#ffae00'));
        }

        draw(ctx) {
            if (this.hidden || !isSpriteLoaded) return;
            if (!this.isPlayer1 && this.infinityActive) {
                ctx.save(); ctx.beginPath(); ctx.arc(this.x + this.width/2, this.y + this.height/2, 120, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(100, 200, 255, 0.2)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(50, 150, 255, 0.8)'; ctx.stroke(); ctx.restore();
            }

            ctx.save();
            ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
            if (this.direction === -1) ctx.scale(-1, 1);
            if (this.isCrushed) ctx.scale(this.crushFactor, 1.0 + (1.0 - this.crushFactor)); 
            if (this.rotation !== 0) ctx.rotate(this.rotation);

            ctx.drawImage(spriteCacheFrames[this.frameIndex], -this.width / 2, -this.height / 2, this.width, this.height);
            
            if (this.hasFlag) {
                ctx.save(); ctx.fillStyle = '#aaa'; ctx.fillRect(-30, -120, 6, 100);
                let time = Date.now() / 150; let flagX = -28; let flagY = -120;
                let colors = ['#e40303', '#ff8c00', '#ffed00', '#008026', '#004dff', '#750787'];
                for(let i=0; i<colors.length; i++) {
                    ctx.beginPath(); ctx.moveTo(flagX, flagY + i * 8);
                    for(let x=0; x<=60; x+=10) ctx.lineTo(flagX + x, flagY + i * 8 + Math.sin(time + x/10) * 5);
                    ctx.lineTo(flagX + 60, flagY + (i+1) * 8 + Math.sin(time + 6) * 5);
                    for(let x=60; x>=0; x-=10) ctx.lineTo(flagX + x, flagY + (i+1) * 8 + Math.sin(time + x/10) * 5);
                    ctx.fillStyle = colors[i]; ctx.fill();
                }
                ctx.fillStyle = '#fff'; ctx.font = '16px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
                ctx.translate(flagX + 30, flagY + 28 + Math.sin(time + 3)*5); if (this.direction === -1) ctx.scale(-1, 1);
                ctx.fillText("GAY", 0, 0); ctx.restore();
            }

            if (this.isPlayer1 && p1HasXEyes) {
                ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(5, -15); ctx.lineTo(15, -5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(15, -15); ctx.lineTo(5, -5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(25, -15); ctx.lineTo(35, -5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(35, -15); ctx.lineTo(25, -5); ctx.stroke();
            }
            ctx.restore();
        }

        takeDamage(amount) {
            if (Ultimate.active && this === Ultimate.target) this.hp = Math.max(1, this.hp - amount);
            else this.hp -= amount;
            if (this.hp < 0) this.hp = 0;
            
            if (this.isPlayer1) p1HealthBar.style.width = `${(this.hp / MAX_HEALTH) * 100}%`;
            else p2HealthBar.style.width = `${(this.hp / MAX_HEALTH) * 100}%`;

            for(let i=0; i<15; i++) particles.push(new Particle(this.x + this.width/2, this.y + this.height/2, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8 - 2, this.isCrushed ? 'rgba(255,0,0,0.8)' : '#fff'));
            damageTexts.push(new DamageText(this.x + this.width/2 + (Math.random() - 0.5) * 40, this.y - 10 + (Math.random() - 0.5) * 40, amount));
        }
    }

    class Cannonball {
        constructor(x, y, direction, isP1) {
            this.x = x; this.y = y; this.radius = 8; this.vx = direction * 15; this.vy = -2; this.isP1 = isP1;
            this.active = true; this.damage = 15 + Math.floor(Math.random() * 5); 
        }
        update() {
            this.vy += GRAVITY * 0.5; this.x += this.vx; this.y += this.vy;
            if (Math.random() > 0.5) particles.push(new Particle(this.x, this.y, 0, -1, 'rgba(50,50,50,0.8)', 10));
            // Check hit block
            for (let b of mapBlocks) {
                if (this.x > b.x && this.x < b.x + b.width && this.y > b.y && this.y < b.y + b.height) this.explode();
            }
            if (this.y + this.radius > FLOOR_Y) this.explode();
            if (this.x < -100 || this.x > canvas.width + 100) this.active = false;
        }
        explode() {
            this.active = false;
            for(let i=0; i<20; i++) particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10 - 2, Math.random() > 0.5 ? '#444' : '#ffae00'));
        }
        draw(ctx) {
            ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#444444'; ctx.beginPath(); ctx.arc(this.x - 2, this.y - 2, this.radius/2, 0, Math.PI * 2); ctx.fill();
        }
    }

    class PrideBeam {
        constructor(source, target) {
            this.source = source; this.target = target; this.active = true; this.isP1 = source.isPlayer1;
            this.damage = 3; this.life = 360; this.isHomingBeam = true; this.vomitPoolRadius = 0;
        }
        update() {
            if (!Ultimate.beamActive) { this.active = false; return; }
            this.life--; if (this.life <= 0) this.active = false;
            screenShake = 15; 
            if (this.life % 4 === 0) this.target.takeDamage(Math.floor(Math.random() * 5) + 5);
            if (this.vomitPoolRadius < 200) this.vomitPoolRadius += 1.5;
            for(let i=0; i<3; i++) particles.push(new Particle(this.target.x + this.target.width/2 + (Math.random() - 0.5) * 40, this.target.y + this.target.height/2 + (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, `hsl(${Math.random() * 360}, 100%, 50%)`));
        }
        explode() {} 
        draw(ctx) {
            let startX = this.source.x + this.source.width / 2 + (this.source.direction * 30); let startY = this.source.y + 20; 
            let endX = this.target.x + this.target.width / 2; let endY = this.target.y + this.target.height / 2;

            ctx.save(); let poolTime = Date.now() / 100;
            for(let i=0; i<5; i++) {
                let rx = Math.max(0.1, this.vomitPoolRadius - (i*10)); let ry = Math.max(0.1, (this.vomitPoolRadius / 4) - (i*2));
                ctx.beginPath(); ctx.ellipse(endX + Math.sin(poolTime + i) * 20, FLOOR_Y + 5, rx, ry, 0, 0, Math.PI*2);
                ctx.fillStyle = `hsla(${(poolTime * 20 + i * 30) % 360}, 100%, 50%, 0.5)`; ctx.fill();
            }
            ctx.restore();

            let dist = Math.hypot(endX - startX, endY - startY); let steps = Math.max(10, Math.floor(dist / 15));
            ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; let time = Date.now() / 50;

            for(let i = 0; i < 6; i++) {
                ctx.beginPath(); ctx.moveTo(startX, startY);
                for(let j = 1; j <= steps; j++) {
                    let t = j / steps; let curX = startX + (endX - startX) * t; let curY = startY + (endY - startY) * t;
                    let arc = Math.sin(t * Math.PI) * -150; let offset = Math.sin(t * 15 + time + i) * (20 + i * 8);
                    ctx.lineTo(curX, curY + arc + offset);
                }
                ctx.lineWidth = 15 + (i * 2); ctx.strokeStyle = `hsla(${((this.life * 15) + (i * 45)) % 360}, 100%, 60%, 0.8)`; ctx.stroke();
            }
            ctx.beginPath(); ctx.moveTo(startX, startY);
            for(let j = 1; j <= steps; j++) {
                let t = j / steps; let curX = startX + (endX - startX) * t; let curY = startY + (endY - startY) * t;
                ctx.lineTo(curX, curY + (Math.sin(t * Math.PI) * -150) + (Math.sin(t * 15 + time) * 10));
            }
            ctx.lineWidth = 12; ctx.strokeStyle = '#ffffff'; ctx.stroke(); ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, vx, vy, color, life = 20) {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.color = color; this.life = life; this.maxLife = life; this.size = Math.random() * 4 + 2;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life--; }
        draw(ctx) { ctx.globalAlpha = this.life / this.maxLife; ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha = 1; }
    }
    class EssenceParticle {
        constructor(x, y, target) { this.x = x; this.y = y; this.target = target; this.life = 60; this.size = Math.random() * 6 + 4; this.hue = Math.random() * 360; }
        update() { this.life--; let tx = this.target.x + this.target.width/2; let ty = this.target.y + this.target.height/2; let angle = Math.atan2(ty - this.y, tx - this.x); this.x += Math.cos(angle) * 8; this.y += Math.sin(angle) * 8; this.hue += 15; }
        draw(ctx) { ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`; ctx.fillRect(this.x, this.y, this.size, this.size); }
    }
    class ExplosionConfetti {
        constructor(x, y, isBlood = false) {
            this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 40; this.vy = (Math.random() - 0.5) * 40 - 10; this.isBlood = isBlood;
            if (isBlood) { this.color = `hsl(0, 100%, ${Math.random() * 30 + 20}%)`; this.size = Math.random() * 8 + 4; } else { this.color = `hsl(${Math.random() * 360}, 100%, 60%)`; this.size = Math.random() * 6 + 4; }
            this.life = 300; this.angle = Math.random() * Math.PI; this.spin = (Math.random() - 0.5) * 0.5;
        }
        update() {
            this.vy += GRAVITY * 0.5; this.vx *= 0.95; 
            if (!this.isBlood) this.x += Math.sin(this.life * 0.1) * 2; 
            this.x += this.vx; this.y += this.vy; this.angle += this.spin;
            if (this.y > FLOOR_Y) { this.y = FLOOR_Y; if (this.isBlood) { this.vy = 0; this.vx *= 0.1; this.spin = 0; } else { this.vy = -this.vy * 0.3; this.vx *= 0.5; } }
            this.life--;
        }
        draw(ctx) { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.fillStyle = this.color; ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size); ctx.restore(); }
    }
    class TextConfetti {
        constructor(startX, startY, targetPoint) { this.x = startX; this.y = startY; this.targetX = targetPoint.x; this.targetY = targetPoint.y; this.vx = (Math.random() - 0.5) * 20; this.vy = -Math.random() * 20 - 10; this.color = `hsl(${Math.random() * 360}, 100%, 60%)`; this.size = 4; this.life = 0; }
        update() { this.life++; if (this.life < 60) { this.vy += GRAVITY * 0.5; this.x += this.vx; this.y += this.vy; } else { this.x += (this.targetX - this.x) * 0.05; this.y += (this.targetY - this.y) * 0.05; } }
        draw(ctx) { ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size); }
    }
    class DamageText {
        constructor(x, y, amount) { this.x = x; this.y = y; this.amount = amount; this.life = 40; this.vy = -1.5; }
        update() { this.y += this.vy; this.life--; }
        draw(ctx) { ctx.globalAlpha = this.life / 40; ctx.fillStyle = '#ff4d4d'; ctx.font = '20px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.fillText(`-${this.amount}`, this.x, this.y); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeText(`-${this.amount}`, this.x, this.y); ctx.globalAlpha = 1; }
    }

    // ================== GAME LOGIC ==================

    function initGame(mode) {
        initAudio(); 
        p1 = new Player(150, 300, true);
        p2 = new Player(800, 300, false);
        projectiles = []; particles = []; damageTexts = [];
        Ultimate.active = false; p1HasXEyes = false;
        
        p1HealthBar.style.width = '100%'; p2HealthBar.style.width = '100%';
        
        gameState = mode;
        mainMenu.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');

        if (mode === 'EDITOR') {
            hud.classList.add('hidden'); // Hide health bars while building
            editorToolbar.classList.remove('hidden');
        } else {
            editorToolbar.classList.add('hidden');
        }
    }

    function checkCollisions() {
        projectiles.forEach(p => {
            if (!p.active || p.isHomingBeam) return; 
            if (p.isP1 && checkAABB(p, p2)) { p2.takeDamage(p.damage); p.explode(); }
            if (!p.isP1 && checkAABB(p, p1)) { p1.takeDamage(p.damage); p.explode(); }
        });
    }

    function checkAABB(a, b) {
        if (a.width !== undefined && b.width !== undefined) {
             return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
        } else if (a.radius !== undefined) {
            return a.x + a.radius > b.x && a.x - a.radius < b.x + b.width && a.y + a.radius > b.y && a.y - a.radius < b.y + b.height;
        }
        return false;
    }

    function applyAbilities(player1, player2) {
        player1.isCrushed = false; player1.crushFactor = 1.0;
        if (player2.infinityActive) {
            let dx = (player1.x + player1.width/2) - (player2.x + player2.width/2);
            let dy = (player1.y + player1.height/2) - (player2.y + player2.height/2);
            let dist = Math.hypot(dx, dy); let auraRadius = 120;
            if (dist < auraRadius) {
                let pushDir = dx > 0 ? 1 : -1; let overlap = auraRadius - dist;
                let intendedX = player1.x + pushDir * 8; 

                // Check Wall Crush against Screen OR Custom Solid Blocks
                let hitCustomWall = false;
                for (let b of mapBlocks) {
                    if (b.type === 'solid' && intendedX < b.x + b.width && intendedX + player1.width > b.x && player1.y < b.y + b.height && player1.y + player1.height > b.y) {
                        hitCustomWall = true; break;
                    }
                }

                if (intendedX <= 0) { player1.x = 0; triggerWallCrush(player1, overlap); }
                else if (intendedX + player1.width >= canvas.width) { player1.x = canvas.width - player1.width; triggerWallCrush(player1, overlap); }
                else if (hitCustomWall) { player1.x = player1.x; triggerWallCrush(player1, overlap); } // Wall Crush on custom maps!
                else { player1.x = intendedX; }
            }
        }
    }

    function triggerWallCrush(player, overlap) {
        if (player.hidden) return; 
        player.isCrushed = true;
        player.crushFactor = Math.max(0.1, 1.0 - (overlap / 120));
        screenShake = 5 + (overlap * 0.2); 
        player.crushDamageTick++;
        if (player.crushDamageTick > 5) { player.takeDamage(Math.floor(overlap / 10) + 1); player.crushDamageTick = 0; }
        if (Math.random() < 0.4) particles.push(new Particle(player.x + player.width/2, player.y + player.height/2, (Math.random()-0.5)*15, (Math.random()-0.5)*15, 'rgba(200, 0, 0, 0.9)'));
        if (player.hp <= 0) {
            player.hidden = true; screenShake = 50;
            for(let i=0; i<400; i++) particles.push(new ExplosionConfetti(player.x + player.width/2, player.y + player.height/2, true));
        }
    }

    function drawEnvironment() {
        if (customBgImage) {
            ctx.drawImage(customBgImage, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#fff';
            ctx.fillRect(100, 100, 80, 30); ctx.fillRect(120, 80, 50, 50);
            ctx.fillRect(700, 150, 100, 40); ctx.fillRect(730, 130, 60, 60);
        }

        drawMapBlocks(); // Draw custom user map

        // Default floor
        ctx.fillStyle = '#2d6a4f'; ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);
        ctx.fillStyle = '#40916c'; ctx.fillRect(0, FLOOR_Y, canvas.width, 10);
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let shakeX = 0, shakeY = 0;
        if (screenShake > 0) {
            shakeX = (Math.random() - 0.5) * screenShake; shakeY = (Math.random() - 0.5) * screenShake;
            screenShake *= 0.9; if (screenShake < 0.5) screenShake = 0;
        }

        ctx.save(); ctx.translate(shakeX, shakeY);

        if (gameState === 'EDITOR') {
            drawEnvironment();
            // Draw Editor Grid Overlay
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            for(let x=0; x<canvas.width; x+=GRID_SIZE) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=0; y<canvas.height; y+=GRID_SIZE) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
        } 
        else if (gameState === 'PLAYING') {
            if (!Ultimate.active || Ultimate.phase !== 4) {
                drawEnvironment();
                Ultimate.update(); p1.update(); p2.update(); applyAbilities(p1, p2);
                projectiles.forEach(p => p.update()); particles.forEach(p => p.update()); damageTexts.forEach(t => t.update());
                checkCollisions();
                projectiles = projectiles.filter(p => p.active); particles = particles.filter(p => p.life > 0 || p instanceof TextConfetti); damageTexts = damageTexts.filter(t => t.life > 0);
                p1.draw(ctx); p2.draw(ctx); projectiles.forEach(p => p.draw(ctx)); particles.forEach(p => p.draw(ctx));
                Ultimate.draw(ctx); damageTexts.forEach(t => t.draw(ctx));
            } else {
                Ultimate.update(); particles.forEach(p => p.update()); Ultimate.draw(ctx); 
            }
            if (!Ultimate.active) {
                if (p1.hp <= 0 && p2.hp <= 0) endGame("IT's A DRAW!");
                else if (p1.hp <= 0) endGame("PLAYER 2 WINS!");
                else if (p2.hp <= 0) endGame("PLAYER 1 WINS!");
            }
        } 
        else if (gameState === 'MENU' || gameState === 'GAMEOVER') {
            drawEnvironment();
            particles.forEach(p => p.update()); particles = particles.filter(p => p.life > 0); particles.forEach(p => p.draw(ctx));
        }

        ctx.restore(); 
        requestAnimationFrame(gameLoop);
    }

    function endGame(text) {
        gameState = 'GAMEOVER'; winText.innerText = text;
        winText.style.color = text.includes("1") ? '#e63946' : text.includes("2") ? '#457b9d' : '#fff';
        hud.classList.add('hidden'); gameOverScreen.classList.remove('hidden');
    }

    function compileSpriteFrame(frameData) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 64; tempCanvas.height = 64;
        const tCtx = tempCanvas.getContext('2d');
        for (let y = 0; y < 64; y++) {
            for (let x = 0; x < 64; x++) {
                if (frameData[y][x] !== '.') {
                    tCtx.fillStyle = colorPalette[frameData[y][x]];
                    tCtx.fillRect(x, y, 1, 1);
                }
            }
        }
        return tempCanvas;
    }
