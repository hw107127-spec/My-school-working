<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAV-SHIFT RIVALS PRO</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');


        body {
            margin: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Share Tech Mono', monospace;
            color: white;
            user-select: none;
        }


        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }


        /* --- SETTINGS BUTTON & MODAL --- */
        #settings-btn {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #0af;
            color: #0af;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 15px;
            cursor: pointer;
            z-index: 200;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.2);
            transition: 0.2s;
        }
        #settings-btn:hover { background: #0af; color: #000; }


        #settings-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 400;
            backdrop-filter: blur(5px);
        }


        .settings-box {
            background: #111;
            border: 2px solid #0af;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 170, 255, 0.2);
        }


        .settings-box h2 {
            font-family: 'Orbitron', sans-serif;
            color: #0af;
            margin-top: 0;
        }


        .keybind-grid {
            display: flex;
            justify-content: space-around;
            text-align: left;
            margin-bottom: 20px;
        }
        
        .keybind-col { width: 45%; }
        .keybind-col h3 { color: #fff; font-family: 'Orbitron'; text-align: center; border-bottom: 1px solid #444; padding-bottom: 5px; }
        
        .bind-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }


        .bind-btn {
            background: #222;
            border: 1px solid #0af;
            color: #0af;
            padding: 5px 10px;
            font-family: 'Share Tech Mono';
            cursor: pointer;
            min-width: 100px;
            text-align: center;
            transition: 0.2s;
        }
        .bind-btn:hover { background: #0af; color: #000; }
        
        #keybind-status {
            color: #ff0;
            font-weight: bold;
            height: 20px;
            margin-bottom: 15px;
        }


        /* --- CUSTOM MAIN MENU --- */
        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(10, 20, 40, 0.4) 0%, rgba(5, 5, 8, 1) 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }


        .title-container { text-align: center; margin-bottom: 40px; }
        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 900;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0 0 20px #0af, 0 0 40px #0af, 4px 4px 0px #f04;
        }
        .game-subtitle { font-size: 20px; color: #0af; letter-spacing: 5px; margin-top: -10px; }
        
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }


        .menu-row { display: flex; gap: 20px; justify-content: center; }


        .btn-menu {
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #0af;
            color: #0af;
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.2);
        }
        .btn-menu:hover {
            background: #0af; color: #000; transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.6);
        }


        /* --- LOCAL PROFILE AUTH (TOP RIGHT) --- */
        #auth-container { position: absolute; top: 20px; right: 20px; z-index: 200; }
        #user-profile {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0, 20, 40, 0.8); border: 1px solid #0af;
            padding: 8px 15px; border-radius: 4px; color: #0af;
            font-family: 'Orbitron', sans-serif; box-shadow: 0 0 15px rgba(0, 170, 255, 0.2);
            cursor: pointer; transition: background 0.2s;
        }
        #user-profile:hover { background: rgba(0, 40, 80, 0.9); }


        #auth-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none; justify-content: center;
            align-items: center; z-index: 300; backdrop-filter: blur(5px);
        }
        .auth-box {
            background: #111; border: 2px solid #0af; padding: 40px; border-radius: 8px;
            text-align: center; box-shadow: 0 0 50px rgba(0, 170, 255, 0.2);
            width: 320px; position: relative;
        }
        .close-btn {
            position: absolute; top: 10px; right: 15px; color: #e74c3c;
            font-family: 'Orbitron'; font-size: 20px; font-weight: bold; cursor: pointer;
        }
        .close-btn:hover { color: #ff7979; }
        .auth-box h1 { margin: 0 0 10px 0; font-size: 24px; font-family: 'Orbitron', sans-serif; color: #0af; text-transform: uppercase; }
        .auth-input {
            width: 100%; padding: 12px; margin-top: 15px; margin-bottom: 20px;
            background: #000; border: 1px solid #0af; color: white;
            font-family: 'Share Tech Mono', monospace; font-size: 18px;
            text-align: center; outline: none; box-sizing: border-box;
        }
        .btn-auth {
            width: 100%; padding: 12px; background: #0af; color: #000;
            font-size: 16px; font-family: 'Orbitron', sans-serif; font-weight: bold;
            border: none; cursor: pointer; transition: background 0.2s;
        }
        .btn-auth:hover { background: #fff; }


        /* --- UI LAYER (IN-GAME) --- */
        #main-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none; flex-direction: column;
            justify-content: space-between; padding: 20px; box-sizing: border-box; z-index: 10;
        }


        .scoreboard { display: flex; justify-content: center; gap: 150px; width: 100%; pointer-events: none; }
        .player-info { display: flex; flex-direction: column; align-items: center; }
        .player-name {
            font-size: 22px; font-family: 'Share Tech Mono', monospace; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8); color: #fff;
        }
        .score-number {
            font-family: 'Orbitron', sans-serif; font-size: 90px; font-weight: 900; margin: 0;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .p1-score .score-number { color: #fff; text-shadow: 0 0 20px #ff4757, 0 0 40px #ff4757, 4px 4px 0px #c0392b; }
        .p2-score .score-number { color: #fff; text-shadow: 0 0 20px #1e90ff, 0 0 40px #1e90ff, 4px 4px 0px #2980b9; }


        .score-anim { animation: scorePop 0.6s ease-out; }
        @keyframes scorePop {
            0% { transform: scale(1); filter: brightness(1); }
            30% { transform: scale(1.6) rotate(5deg); filter: brightness(2); }
            50% { transform: scale(1.4) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }


        #countdown-msg {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            font-size: 120px; font-family: 'Orbitron', sans-serif; font-weight: 900;
            display: none; text-shadow: 0 0 30px #000, 4px 4px 0px #fff; color: #fff; z-index: 50;
        }


        #game-status {
            position: absolute; top: 20px; left: 20px; font-weight: bold; color: #ccc;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #444; pointer-events: auto;
        }


        .online-code { color: #0af; font-size: 1.4em; background: #222; padding: 2px 6px; border-radius: 4px; user-select: text; }


        .controls-hint {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid #333;
            pointer-events: none;
        }


        #join-modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a1a1a; border: 2px solid #0af; padding: 30px; border-radius: 12px; z-index: 100; text-align: center; pointer-events: auto;
        }
        #join-code-input {
            background: #333; border: 1px solid #555; color: white; font-size: 32px;
            text-align: center; width: 150px; padding: 10px; border-radius: 6px; letter-spacing: 5px;
            outline: none; margin: 20px 0; font-family: 'Share Tech Mono', monospace;
        }
        .btn-confirm { background: #0af; color: #000; padding: 10px 20px; border: none; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; border-radius: 4px; }
        .btn-confirm:hover { background: #fff; }
        .btn-cancel { background: #e74c3c; color: #fff; padding: 10px 20px; border: none; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; border-radius: 4px; margin-left: 10px; }
    </style>
</head>
<body>


<!-- SETTINGS UI -->
<div id="settings-btn" onclick="openSettings()">⚙ SETTINGS</div>


<div id="settings-modal">
    <div class="settings-box">
        <div class="close-btn" onclick="closeSettings()">X</div>
        <h2>KEY BINDINGS</h2>
        <div id="keybind-status"></div>
        <div class="keybind-grid" id="keybind-list"></div>
        <button class="btn-auth" onclick="closeSettings()">DONE</button>
    </div>
</div>


<!-- LOCAL AUTHENTICATION CORNER -->
<div id="auth-container">
    <div id="user-profile" onclick="openAuthScreen()">
        <span id="display-username">PILOT_UNKNOWN</span>
    </div>
</div>


<div id="auth-screen">
    <div class="auth-box">
        <div class="close-btn" onclick="closeAuthScreen()">X</div>
        <h1>PILOT PROFILE</h1>
        <div style="color:#aaa; font-size: 12px; font-family: 'Share Tech Mono'">Register your local callsign</div>
        <input type="text" id="username-input" class="auth-input" placeholder="CALLSIGN" maxlength="10">
        <button class="btn-auth" onclick="saveProfile()">SAVE RECORD</button>
    </div>
</div>


<!-- MAIN MENU -->
<div id="main-menu">
    <div class="title-container">
        <h1 class="game-title">GRAV-SHIFT</h1>
        <div class="game-subtitle">R I V A L S</div>
    </div>
    
    <div class="menu-buttons">
        <div class="menu-row">
            <button class="btn-menu" onclick="startLocalGame()">LOCAL MATCH</button>
            <button class="btn-menu" onclick="hostOnlineGame()">HOST ONLINE</button>
            <button class="btn-menu" onclick="promptJoinGame()">JOIN ONLINE</button>
        </div>
    </div>
</div>


<!-- MAIN GAME UI -->
<div id="main-ui">
    <div class="scoreboard">
        <div class="player-info p1-score">
            <span class="player-name" id="name1">Player 1</span>
            <div class="score-number" id="score1">0</div>
        </div>
        <div class="player-info p2-score">
            <span class="player-name" id="name2">CPU</span>
            <div class="score-number" id="score2">0</div>
        </div>
    </div>
    
    <div id="countdown-msg">3</div>
    
    <div id="game-status">
        <div style="margin-bottom:8px; font-size: 1.1em; border-bottom: 1px solid #444; padding-bottom: 5px;">GRAV-SHIFT RIVALS</div>
        <div id="status-text">MODE: LOCAL</div>
        <button onclick="returnToMenu()" style="margin-top: 10px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; padding: 5px 10px; font-family:'Share Tech Mono'">End Match</button>
    </div>


    <div class="controls-hint" id="hud-controls"></div>


    <!-- Join Modal -->
    <div id="join-modal">
        <h2 style="margin:0 0 5px 0; color:#fff; font-family:'Orbitron'">JOIN MATCH</h2>
        <div style="color:#aaa; font-size:14px; margin-bottom: 10px; font-family:'Share Tech Mono'">Enter Host's Code</div>
        <input type="text" id="join-code-input" maxlength="4" placeholder="0000">
        <br>
        <button class="btn-confirm" id="btn-connect">CONNECT</button>
        <button class="btn-cancel" id="btn-cancel" onclick="closeJoinModal()">CANCEL</button>
    </div>
</div>


<canvas id="gameCanvas"></canvas>


<!-- GAME LOGIC SCRIPT -->
<script>
// --- Profile Management ---
window.myUsername = "PLAYER 1";


function loadProfile() {
    const saved = localStorage.getItem('gsr_pilot');
    if (saved) {
        window.myUsername = saved;
    } else {
        window.myUsername = "PILOT_" + Math.floor(Math.random() * 9999);
    }
    document.getElementById('display-username').innerText = window.myUsername;
    document.getElementById('username-input').value = window.myUsername;
}


window.openAuthScreen = function() { document.getElementById('auth-screen').style.display = 'flex'; }
window.closeAuthScreen = function() { document.getElementById('auth-screen').style.display = 'none'; }
window.saveProfile = function() {
    const name = document.getElementById('username-input').value.trim().toUpperCase();
    if(name) {
        localStorage.setItem('gsr_pilot', name);
        window.myUsername = name;
        document.getElementById('display-username').innerText = name;
        closeAuthScreen();
    }
}
loadProfile(); 


// --- Keybinds Management ---
const P1_DEFAULTS = { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', surge: 'ShiftLeft', dash: 'KeyV', zeroG: 'Space' };
const P2_DEFAULTS = { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', surge: 'ShiftRight', dash: 'Period', zeroG: 'Enter' };


let P1_KEYS = JSON.parse(localStorage.getItem('gsr_p1_keys')) || {...P1_DEFAULTS};
let P2_KEYS = JSON.parse(localStorage.getItem('gsr_p2_keys')) || {...P2_DEFAULTS};
let rebindState = null;


function updateControlsHint() {
    document.getElementById('hud-controls').innerHTML = `
        <b>P1:</b> ${P1_KEYS.up.replace('Key','')}/${P1_KEYS.left.replace('Key','')}/${P1_KEYS.down.replace('Key','')}/${P1_KEYS.right.replace('Key','')} | ${P1_KEYS.zeroG} (ZeroG) | ${P1_KEYS.surge} (Surge) | <b>${P1_KEYS.dash.replace('Key','')} (Dash)</b><br>
        <b>P2:</b> ${P2_KEYS.up.replace('Arrow','')}/${P2_KEYS.left.replace('Arrow','')}/${P2_KEYS.down.replace('Arrow','')}/${P2_KEYS.right.replace('Arrow','')} | ${P2_KEYS.zeroG} (ZeroG) | ${P2_KEYS.surge} (Surge) | <b>${P2_KEYS.dash.replace('Key','')} (Dash)</b><br>
        <i>Online: Both players use P1 Controls</i>
    `;
}


window.openSettings = function() {
    document.getElementById('settings-modal').style.display = 'flex';
    renderKeybinds();
}
window.closeSettings = function() {
    document.getElementById('settings-modal').style.display = 'none';
    rebindState = null;
    updateControlsHint();
}
function renderKeybinds() {
    let p1Html = `<h3>PLAYER 1</h3>`;
    let p2Html = `<h3>PLAYER 2</h3>`;
    for(let action in P1_KEYS) {
        p1Html += `<div class="bind-row"><span>${action.toUpperCase()}:</span> <button class="bind-btn" onclick="triggerRebind(1, '${action}')">${P1_KEYS[action]}</button></div>`;
    }
    for(let action in P2_KEYS) {
        p2Html += `<div class="bind-row"><span>${action.toUpperCase()}:</span> <button class="bind-btn" onclick="triggerRebind(2, '${action}')">${P2_KEYS[action]}</button></div>`;
    }
    document.getElementById('keybind-list').innerHTML = `<div class="keybind-col">${p1Html}</div><div class="keybind-col">${p2Html}</div>`;
}
window.triggerRebind = function(player, action) {
    rebindState = { player, action };
    document.getElementById('keybind-status').innerText = `Press any key for Player ${player} [${action.toUpperCase()}]...`;
}
updateControlsHint();


// --- Initialization & Globals ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const elScore1 = document.getElementById('score1');
const elScore2 = document.getElementById('score2');
const elName1 = document.getElementById('name1');
const elName2 = document.getElementById('name2');
const elCountdown = document.getElementById('countdown-msg');
const elStatus = document.getElementById('status-text');
const elJoinModal = document.getElementById('join-modal');
const elJoinInput = document.getElementById('join-code-input');


let width, height;
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();


// --- Configuration ---
const CONFIG = {
    gravity: 0.6, ballGravity: 0.2, friction: 0.85, playerSpeed: 1.5, maxSpeed: 9,
    surgeMultiplier: 2.5, dashForce: 25, dashCooldown: 90, wallSlideFriction: 0.8,
    wallJumpForce: 16, wallBoostDuration: 90, smashForce: 22, zeroGFriction: 0.96,
    zeroGSpeed: 0.4, zeroGMaxSpeed: 6, sloMoFactor: 0.15, playerSize: 34,
    ballSize: 18, ballBounciness: 0.8, goalWidth: 70
};


// --- Game State Vars ---
const STATE = { WAITING_SYNC: -1, COUNTDOWN: 0, PLAYING: 1 };
let currentState = STATE.PLAYING;


let rivalUsername = "CPU";
let gameActive = false; 
let score1 = 0, score2 = 0;
let screenFlash = 0;
let particles = [], stars = []; 
let shake = 0, frameCount = 0;
let aiEnabled = false; 


// Networking
let isOnline = false, isHost = false;
let peer = null, conn = null;
let remoteInput = { left: false, right: false, up: false, down: false, surge: false };


// Input Object
const keys = {};
const mouse = { x: 0, y: 0, worldX: 0, worldY: 0, down: false };


// --- Background ---
for(let i=0; i<100; i++) {
    stars.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, size: Math.random() * 2, speed: Math.random() * 0.5 + 0.1, alpha: Math.random() });
}


// --- Sound Effects Engine ---
const AudioEngine = {
    ctx: null,
    init: function() {
        if(!this.ctx) {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
    },
    play: function(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        const now = this.ctx.currentTime;
        
        if (type === 'shoot' || type === 'hit') {
            osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'die') {
            // Loud impact for goal
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(10, now + 1.0);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 1.0);
            osc.start(now); osc.stop(now + 1.0);
        } else if (type === 'countdown') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'go') {
            osc.type = 'square'; osc.frequency.setValueAtTime(880, now); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        }
    }
};


// --- Classes ---
class Particle {
    constructor(x, y, color, speedMulti=1) {
        this.x = x; this.y = y; this.color = color;
        this.size = Math.random() * 6 + 2;
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 5 * speedMulti;
        this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
        this.life = 1.0; this.decay = Math.random() * 0.03 + 0.02;
    }
    update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; this.size *= 0.95; }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.rect(this.x, this.y, this.size, this.size); ctx.fill(); ctx.globalAlpha = 1.0;
    }
}


class Ball {
    constructor() { this.r = CONFIG.ballSize; this.reset(); this.wobble = 0; }
    reset() {
        this.x = canvas.width / 2; this.y = canvas.height / 2;
        this.vx = 0; this.vy = 0; this.gravityDir = 1; this.lastHitColor = '#fff'; this.lastHitPlayerId = 0;
        this.isTrapped = false; this.trappedVelocity = { x: 0, y: 0 };
    }
    update() {
        this.wobble += 0.1;
        if (this.isTrapped) {
            let owner = this.lastHitPlayerId === 1 ? p1 : p2;
            if (!owner.isZeroG) {
                this.isTrapped = false; this.vx = this.trappedVelocity.x * 1.2; this.vy = this.trappedVelocity.y * 1.2;
                shake = 5; for(let i=0; i<10; i++) particles.push(new Particle(this.x, this.y, '#fff', 2));
            } else {
                this.x += this.trappedVelocity.x * CONFIG.sloMoFactor; this.y += this.trappedVelocity.y * CONFIG.sloMoFactor;
                if (this.y + this.r > canvas.height || this.y - this.r < 0) this.trappedVelocity.y *= -1;
            }
        } else {
            this.vy += CONFIG.ballGravity * this.gravityDir; this.vx *= 0.98; this.x += this.vx; this.y += this.vy;

class Player {
    constructor(id, color, keysConfig) {

        this.color = color; this.keysConfig = keysConfig; this.reset(); this.ghosts = [];
    }
    reset() {
        this.gravityDir = 1; this.facingDir = 1; this.canFlipToggle = true;
        this.vx = 0; this.vy = 0; this.isZeroG = false; this.onWall = false;
        this.wallBoostTimer = 0; this.dashTimer = 0; this.ghosts = []; this.aiCooldown = 0; 
        this.y = canvas.height - this.height; 
        
        const START_OFFSET = 600;
        this.x = this.id === 1 ? canvas.width/2 - START_OFFSET : canvas.width/2 + START_OFFSET - this.width;
        this.facingDir = this.id === 1 ? 1 : -1;
    }
    toggleZeroG() { this.isZeroG = !this.isZeroG; for(let i=0; i<8; i++) particles.push(new Particle(this.x + this.width/2, this.y + this.height/2, this.color)); }
    tryDash() {
        if (this.dashTimer > 0) return;
        let dirX = 0, dirY = 0;
        if (this.id === 1) { 
            if (keys[P1_KEYS.left]) dirX = -1; if (keys[P1_KEYS.right]) dirX = 1;
            if (keys[P1_KEYS.up]) dirY = -1; if (keys[P1_KEYS.down]) dirY = 1;
        } else { 
            if (isOnline && isHost) { if (remoteInput.left) dirX = -1; if (remoteInput.right) dirX = 1; if (remoteInput.up) dirY = -1; if (remoteInput.down) dirY = 1; }
            else if (aiEnabled) { if (ball.x > this.x) dirX = 1; else dirX = -1; if (Math.abs(ball.y - this.y) > 200) dirY = ball.y > this.y ? 1 : -1; }
            else if (!isOnline) { if (keys[P2_KEYS.left]) dirX = -1; if (keys[P2_KEYS.right]) dirX = 1; if (keys[P2_KEYS.up]) dirY = -1; if (keys[P2_KEYS.down]) dirY = 1; }
        }
        if (dirX === 0 && dirY === 0) dirX = this.facingDir;
        let len = Math.sqrt(dirX*dirX + dirY*dirY) || 1; dirX /= len; dirY /= len;
        this.vx = dirX * CONFIG.dashForce; this.vy = dirY * CONFIG.dashForce;
        this.dashTimer = CONFIG.dashCooldown; shake = 5; this.wallBoostTimer = 30;
        for(let i=0; i<10; i++) particles.push(new Particle(this.x + this.width/2, this.y + this.height/2, '#fff', 3));
    }
    updateAI() {
        if (!aiEnabled || this.id !== 2) return;
        let targetX = ball.x + (ball.x > this.x ? -20 : 20); 
        if (ball.x > this.x) targetX = ball.x + 50; 
        if (this.x < targetX - 10) { this.vx += CONFIG.playerSpeed; this.facingDir = 1; } 
        else if (this.x > targetX + 10) { this.vx -= CONFIG.playerSpeed; this.facingDir = -1; }
        if (this.canFlipToggle && Math.abs(this.x - ball.x) < 300) {
            let ballIsUp = ball.y < canvas.height / 2; let meIsUp = this.y < canvas.height / 2;
            if (ballIsUp && !meIsUp && this.gravityDir === 1) { this.gravityDir = -1; this.canFlipToggle = false; this.vy = 0; } 
            else if (!ballIsUp && meIsUp && this.gravityDir === -1) { this.gravityDir = 1; this.canFlipToggle = false; this.vy = 0; }
        }
        if (!this.canFlipToggle && Math.abs(this.vy) > 0.1 && Math.random() > 0.9) this.canFlipToggle = true; 
        if (this.dashTimer === 0 && Math.abs(ball.x - this.x) > 400) this.tryDash();
    }
    update() {
        if (this.id === 2 && aiEnabled && !isOnline) this.updateAI();
        if (this.dashTimer > 0) this.dashTimer--;
        let kLeft, kRight, kUp, kDown, kSurge;
        if (this.id === 1) { kLeft = keys[P1_KEYS.left]; kRight = keys[P1_KEYS.right]; kUp = keys[P1_KEYS.up]; kDown = keys[P1_KEYS.down]; kSurge = keys[P1_KEYS.surge]; }
        else {
            if (isOnline && isHost) { kLeft = remoteInput.left; kRight = remoteInput.right; kUp = remoteInput.up; kDown = remoteInput.down; kSurge = remoteInput.surge; if (!kUp && !kDown) this.canFlipToggle = true; }
            else if (aiEnabled) { kLeft = false; kRight = false; kUp = false; kDown = false; kSurge = false; }
            else if (!isOnline) { kLeft = keys[P2_KEYS.left]; kRight = keys[P2_KEYS.right]; kUp = keys[P2_KEYS.up]; kDown = keys[P2_KEYS.down]; kSurge = keys[P2_KEYS.surge]; }
        }
        this.isSurging = kSurge && !this.isZeroG;
        
        this.onWall = (this.x <= 0 || this.x + this.width >= canvas.width);
        
        if (this.wallBoostTimer > 0) {
            this.wallBoostTimer--;
            if (frameCount % 4 === 0) this.ghosts.push({ x: this.x, y: this.y, w: this.width, h: this.height, alpha: 0.6, facingDir: this.facingDir, gravityDir: this.gravityDir, color: '#00ffff' });
        }
        for(let i = this.ghosts.length - 1; i >= 0; i--) { this.ghosts[i].alpha -= 0.05; if(this.ghosts[i].alpha <= 0) this.ghosts.splice(i, 1); }


        if (this.isZeroG) {
            if (kLeft) { this.vx -= CONFIG.zeroGSpeed; this.facingDir = -1; } if (kRight) { this.vx += CONFIG.zeroGSpeed; this.facingDir = 1; }
            if (kUp) this.vy -= CONFIG.zeroGSpeed; if (kDown) this.vy += CONFIG.zeroGSpeed;
            this.vx *= CONFIG.zeroGFriction; this.vy *= CONFIG.zeroGFriction;
            let speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
            if (speed > CONFIG.zeroGMaxSpeed && this.dashTimer < CONFIG.dashCooldown - 10) { let ratio = CONFIG.zeroGMaxSpeed / speed; this.vx *= ratio; this.vy *= ratio; }
            
            // Explicit Up/Down Gravity
            if (kUp && kDown) {
                if (this.canFlipToggle) { this.gravityDir *= -1; this.canFlipToggle = false; }
            } else {
                if (kDown) this.gravityDir = 1;
                if (kUp) this.gravityDir = -1;
            }
        } else {
            if (kLeft) { this.vx -= CONFIG.playerSpeed; this.facingDir = -1; if (this.onWall) { this.vx = -CONFIG.wallJumpForce; this.activateWallBoost(); } }
            if (kRight) { this.vx += CONFIG.playerSpeed; this.facingDir = 1; if (this.onWall) { this.vx = CONFIG.wallJumpForce; this.activateWallBoost(); } }
            
            if (this.id === 1 || (!aiEnabled && !isOnline) || (isOnline && isHost)) {
                // Explicit Up/Down Gravity mapping
                if (kUp && kDown) {
                    if (this.canFlipToggle) { this.gravityDir *= -1; this.canFlipToggle = false; this.vy = 0; for(let i=0; i<5; i++) particles.push(new Particle(this.x + this.width/2, this.y + this.height/2, '#fff')); }
                } else if (kUp && this.gravityDir === 1) {
                    this.gravityDir = -1; this.vy = 0; for(let i=0; i<5; i++) particles.push(new Particle(this.x + this.width/2, this.y + this.height/2, '#fff'));
                } else if (kDown && this.gravityDir === -1) {
                    this.gravityDir = 1; this.vy = 0; for(let i=0; i<5; i++) particles.push(new Particle(this.x + this.width/2, this.y + this.height/2, '#fff'));
                }
            }
            
            let gMultiplier = this.isSurging ? CONFIG.surgeMultiplier : 1;
            if (this.isSurging && Math.random() > 0.5) { let p = new Particle(this.x + Math.random()*this.width, this.y + this.height/2, this.color); p.vy = -5 * this.gravityDir; p.vx = 0; particles.push(p); }
            this.vx *= CONFIG.friction; this.vy += (CONFIG.gravity * gMultiplier) * this.gravityDir;
            if (this.onWall && !this.isSurging) { this.vy *= CONFIG.wallSlideFriction; if (Math.abs(this.vy) > 2) { let side = this.x <= 0 ? 0 : this.width; particles.push(new Particle(this.x + side, this.y + this.height/2 + (Math.random()*20 - 10), '#f1c40f', 0.5)); } }
            if (this.dashTimer < CONFIG.dashCooldown - 10) {
                this.vx = Math.max(Math.min(this.vx, CONFIG.maxSpeed), -CONFIG.maxSpeed);
                let termVel = this.isSurging ? CONFIG.maxSpeed * 2 : CONFIG.maxSpeed;
                this.vy = Math.max(Math.min(this.vy, termVel), -termVel);
            }
        }
        
        this.x += this.vx; this.y += this.vy;


        if (this.y + this.height > canvas.height) { this.y = canvas.height - this.height; if (this.isZeroG) this.vy *= -0.5; else if (this.gravityDir === 1) this.vy = 0; else this.vy *= -0.5; }
        if (this.y < 0) { this.y = 0; if (this.isZeroG) this.vy *= -0.5; else if (this.gravityDir === -1) this.vy = 0; else this.vy *= -0.5; }
        if (this.x < 0) { this.x = 0; if(!this.onWall) this.vx *= -0.5; }
        if (this.x + this.width > canvas.width) { this.x = canvas.width - this.width; if(!this.onWall) this.vx *= -0.5; }
    }
    activateWallBoost() { this.wallBoostTimer = CONFIG.wallBoostDuration; for(let i=0; i<10; i++) particles.push(new Particle(this.x + this.width/2, this.y + this.height/2, '#ff0000', 3)); }
    draw(ctx) {
        this.ghosts.forEach(g => {
            ctx.save(); ctx.translate(g.x + g.w/2, g.y + g.h/2); ctx.scale(1, g.gravityDir === -1 ? -1 : 1);
            ctx.globalAlpha = g.alpha; ctx.fillStyle = g.color; ctx.fillRect(-g.w/2, -g.h/2, g.w, g.h); ctx.restore();
        });
        ctx.save(); ctx.translate(this.x + this.width/2, this.y + this.height/2);
        let scaleY = this.gravityDir === -1 ? -1 : 1; ctx.scale(1, scaleY); 
        if (this.isSurging) ctx.translate((Math.random()-0.5)*2, (Math.random()-0.5)*2);
        if (this.wallBoostTimer > 0) { ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 25; ctx.fillStyle = 'rgba(0, 255, 255, 0.5)'; let trailLen = Math.abs(this.vx) * 3; if (trailLen > 5) { let trailDir = this.facingDir * -1; ctx.fillRect(trailDir * (this.width/2 + 5), -5, trailDir * trailLen, 10); } } 
        else if (this.isZeroG) { ctx.shadowColor = this.color; ctx.shadowBlur = 15; ctx.rotate(Math.sin(frameCount * 0.05) * 0.15); }
        let isP1 = this.id === 1; let mainColor = isP1 ? (this.isSurging ? '#e74c3c' : '#c0392b') : (this.isSurging ? '#3498db' : '#2980b9'); let glowColor = this.color;
        if (this.wallBoostTimer > 0) mainColor = '#fff';

            ctx.fillStyle = '#fff'; let lookOffset = this.facingDir * 4; ctx.beginPath(); ctx.moveTo(lookOffset - 6, -4); ctx.lineTo(lookOffset + 6, -4); ctx.lineTo(lookOffset, 4); ctx.fill();
        } else {
            ctx.fillStyle = mainColor; ctx.beginPath(); let r = 8; let w = this.width/2; let h = this.height/2; ctx.moveTo(-w + r, -h); ctx.lineTo(w - r, -h); ctx.quadraticCurveTo(w, -h, w, -h + r); ctx.lineTo(w, h - r); ctx.quadraticCurveTo(w, h, w - r, h); ctx.lineTo(-w + r, h); ctx.quadraticCurveTo(-w, h, -w, h - r); ctx.lineTo(-w, -h + r); ctx.quadraticCurveTo(-w, -h, -w + r, -h); ctx.fill();
            ctx.fillStyle = glowColor; ctx.beginPath(); ctx.arc(0, 0, w - 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; let lookOffset = this.facingDir * 5; ctx.fillRect(lookOffset - 7, -5, 5, 10); ctx.fillRect(lookOffset + 2, -5, 5, 10);
        }
        if (this.dashTimer > 0) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-this.width/2, -this.height/2 - 10, this.width * (this.dashTimer/CONFIG.dashCooldown), 4); }
        if (this.isZeroG) { ctx.fillStyle = '#f1c40f'; ctx.fillRect(-6, this.height/2, 4, 6); ctx.fillRect(2, this.height/2, 4, 6); }
        ctx.restore();
    }
}


// --- Init Global Objects ---
const ball = new Ball();
const p1 = new Player(1, '#ff4757', P1_KEYS);
const p2 = new Player(2, '#1e90ff', P2_KEYS);


// --- Core Game Functions ---
function resolveCollisions() {
    [p1, p2].forEach(p => {
        let testX = Math.max(p.x, Math.min(ball.x, p.x + p.width)); let testY = Math.max(p.y, Math.min(ball.y, p.y + p.height));
        let distX = ball.x - testX; let distY = ball.y - testY; let distance = Math.sqrt(distX*distX + distY*distY);
        if (distance < ball.r) {
            let angle = Math.atan2(ball.y - (p.y + p.height/2), ball.x - (p.x + p.width/2));
            let force = 10;
            if (p.wallBoostTimer > 0) { force = CONFIG.smashForce; shake = 10; for(let i=0; i<20; i++) particles.push(new Particle(ball.x, ball.y, '#ff0000', 4)); }
            let vx = Math.cos(angle) * force + (p.vx * 0.5); let vy = Math.sin(angle) * force + (p.vy * 0.5);
            ball.lastHitPlayerId = p.id;
            if (p.isZeroG) { ball.isTrapped = true; ball.trappedVelocity = { x: vx, y: vy }; ball.lastHitColor = p.color; shake = 2; } 
            else {
                ball.isTrapped = false; ball.vx = vx; ball.vy = vy;
                if (ball.gravityDir !== p.gravityDir) { ball.gravityDir = p.gravityDir; for(let i=0; i<8; i++) particles.push(new Particle(ball.x, ball.y, p.color)); }
                ball.lastHitColor = p.color; shake = 3;
            }
            for(let i=0; i<4; i++) particles.push(new Particle(ball.x, ball.y, '#fff'));
        }
    });
    if (p1.x < p2.x + p2.width && p1.x + p1.width > p2.x && p1.y < p2.y + p2.height && p1.y + p1.height > p2.y) {
        let dx = (p1.x + p1.width/2) - (p2.x + p2.width/2); let dy = (p1.y + p1.height/2) - (p2.y + p2.height/2);
        let len = Math.sqrt(dx*dx + dy*dy) || 1; dx /= len; dy /= len;
        let push = 8; p1.vx += dx * push; p1.vy += dy * push; p2.vx -= dx * push; p2.vy -= dy * push;
        for(let i=0; i<5; i++) particles.push(new Particle(p1.x + p1.width/2, p1.y + p1.height/2, '#fff', 2));
    }
}


function updateScoreUI(id) {
    if (id === 1) {
        elScore1.innerText = score1;
        elScore1.classList.remove('score-anim');
        void elScore1.offsetWidth; 
        elScore1.classList.add('score-anim');
    } else {
        elScore2.innerText = score2;
        elScore2.classList.remove('score-anim');
        void elScore2.offsetWidth; 
        elScore2.classList.add('score-anim');
    }
}


function startGoalSequence(id) { 
    if (id === 1) { score1++; updateScoreUI(1); } 
    else { score2++; updateScoreUI(2); }
    
    screenFlash = 1.0;
    AudioEngine.play('die'); // Loud impact sound for goal
    
    for(let i=0; i<50; i++) particles.push(new Particle(canvas.width/2, canvas.height/2, id===1?'#ff4757':'#1e90ff', 6));
    
    // Instant Reset
    ball.reset(); 
    p1.reset(); 
    p2.reset(); 
    
    // Check win condition
    if (score1 >= 5 || score2 >= 5) {
        score1 = 0; score2 = 0;
        updateScoreUI(1); updateScoreUI(2);
        startMatchCountdown();
    }
}


function drawForceFieldGoal(x, width, height, colorBase) {
    ctx.save(); let grad = ctx.createLinearGradient(x, 0, x + width, 0);
    grad.addColorStop(0, colorBase + '11'); grad.addColorStop(0.5, colorBase + '44'); grad.addColorStop(1, colorBase + '11');
    ctx.fillStyle = grad; ctx.fillRect(x, 0, width, height); ctx.strokeStyle = colorBase + '88'; ctx.lineWidth = 2;
    let offset = (frameCount * 2) % 40; for(let y = offset - 40; y < height; y += 40) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + width, y); ctx.stroke(); }
    ctx.strokeStyle = colorBase; ctx.lineWidth = 3; ctx.strokeRect(x, 0, width, height); ctx.restore();
}


function drawBackground() {
    ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#ffffff';
    stars.forEach(star => { star.x -= star.speed; if (star.x < 0) star.x = canvas.width; ctx.globalAlpha = star.alpha; ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill(); });
    ctx.globalAlpha = 1.0;
}


// --- Menu Actions ---
window.hostOnlineGame = function() {
    AudioEngine.init();
    const code = generateRoomId();
    const peerId = 'gb-' + code; 
    
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('main-ui').style.display = 'flex';
    gameActive = true;
    
    elStatus.innerHTML = `Connecting to Server...`;
    if(peer) peer.destroy();
    peer = new Peer(peerId);
    
    peer.on('open', (id) => {
        isOnline = true; isHost = true; aiEnabled = false;
        elName1.innerText = window.myUsername;
        elName2.innerText = "WAITING...";
        elStatus.innerHTML = `<span style="color:#aaa; font-size:0.8em">HOSTING</span><br>CODE: <span class="online-code">${code}</span>`;
        currentState = STATE.WAITING_SYNC; 
        ball.reset(); p1.reset(); p2.reset();
    });


    peer.on('connection', (c) => {
        conn = c;
        rivalUsername = c.metadata.username || "RIVAL";
        elName2.innerText = rivalUsername;
        
        setupConnection();
        elStatus.innerHTML = `<span style="color:#0af">${rivalUsername} CONNECTED!</span>`;
        
        conn.on('open', () => {
            conn.send({ t: 'setup', hostName: window.myUsername });
            startMatchCountdown();
        });
    });


    peer.on('error', (err) => { elStatus.innerHTML = `Network Error.`; isOnline = false; });
}


window.promptJoinGame = function() {
    elJoinModal.style.display = 'block'; 
    elJoinInput.value = ''; elJoinInput.focus();
}
window.closeJoinModal = function() { elJoinModal.style.display = 'none'; }


document.getElementById('btn-connect').addEventListener('click', () => {
    const code = elJoinInput.value;
    if (!code || code.length !== 4) return;
    
    AudioEngine.init();
    closeJoinModal();
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('main-ui').style.display = 'flex';
    gameActive = true;
    
    const peerId = 'gb-' + code;
    elStatus.innerHTML = `Searching for ${code}...`;
    if(peer) peer.destroy();
    peer = new Peer();
    
    peer.on('open', () => { 
        conn = peer.connect(peerId, { metadata: { username: window.myUsername } }); 
        setupConnection(); 
        currentState = STATE.WAITING_SYNC;
    });
    peer.on('error', (err) => { elStatus.innerHTML = `Failed to join.`; isOnline = false; });
});


function setupConnection() {
    isOnline = true;
    conn.on('open', () => {
        if (!isHost) elStatus.innerHTML = `CONNECTED<br><small style="color:#0af">PLAYING AS BLUE</small>`;
    });
    
    conn.on('data', (data) => {
        if (isHost) {
            if (data.t === 'input') {
                remoteInput = data.i;
                if (data.ev === 'toggleZeroG' && currentState === STATE.PLAYING) p2.toggleZeroG();
                if (data.ev === 'dash' && currentState === STATE.PLAYING) p2.tryDash();
            }
        } else {
            if (data.t === 'setup') {
                rivalUsername = data.hostName || "HOST";
                elName2.innerText = window.myUsername; 
                elName1.innerText = rivalUsername; 
            }
            if (data.t === 'state') applyNetworkState(data);
        }
    });


    conn.on('close', () => {
        elStatus.innerHTML = "DISCONNECTED";
        setTimeout(() => returnToMenu(), 2000);
    });
}


function startMatchCountdown() {
    currentState = STATE.COUNTDOWN;
    let ticks = 0;
    
    elCountdown.style.display = 'block';
    
    const int = setInterval(() => {
        ticks++;
        if (ticks === 1) { elCountdown.innerText = "3"; elCountdown.style.color = "#ff4757"; AudioEngine.play('countdown'); }
        if (ticks === 2) { elCountdown.innerText = "2"; elCountdown.style.color = "#1e90ff"; AudioEngine.play('countdown'); }
        if (ticks === 3) { elCountdown.innerText = "1"; elCountdown.style.color = "#ffffff"; AudioEngine.play('countdown'); }
        if (ticks === 4) { 
            elCountdown.innerText = "GO!"; 
            elCountdown.style.color = "#0f0";
            AudioEngine.play('go');
            currentState = STATE.PLAYING; 
        }
        if (ticks === 5) {
            elCountdown.style.display = 'none';
            elCountdown.style.color = "#fff";
            clearInterval(int);
        }
    }, 800);
}


function applyNetworkState(data) {
    p1.x = data.p1.x; p1.y = data.p1.y; p1.gravityDir = data.p1.gd; p1.facingDir = data.p1.fd;
    p1.isZeroG = data.p1.zg; p1.wallBoostTimer = data.p1.wb; p1.isSurging = data.p1.sg;
    p2.x = data.p2.x; p2.y = data.p2.y; p2.gravityDir = data.p2.gd; p2.facingDir = data.p2.fd;
    p2.isZeroG = data.p2.zg; p2.wallBoostTimer = data.p2.wb; p2.isSurging = data.p2.sg;
    ball.x = data.b.x; ball.y = data.b.y; ball.gravityDir = data.b.gd; ball.lastHitColor = data.b.lc;
    ball.isTrapped = data.b.tr; ball.wobble = data.b.wb;
    
    if (score1 !== data.s.s1) { score1 = data.s.s1; updateScoreUI(1); screenFlash = 1.0; }
    if (score2 !== data.s.s2) { score2 = data.s.s2; updateScoreUI(2); screenFlash = 1.0; }
    
    currentState = data.st;
    
    if (currentState === STATE.COUNTDOWN) { 
        elCountdown.style.display = 'block';
        elCountdown.innerText = data.cdMsg; 
        if (data.cdMsg === "3") elCountdown.style.color = "#ff4757";
        else if (data.cdMsg === "2") elCountdown.style.color = "#1e90ff";
        else if (data.cdMsg === "1") elCountdown.style.color = "#ffffff";
        else if (data.cdMsg === "GO!") elCountdown.style.color = "#0f0";
    }
    else { elCountdown.style.display = 'none'; }
}


window.startLocalGame = function() {
    AudioEngine.init();
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('main-ui').style.display = 'flex';
    elName1.innerText = window.myUsername;
    elName2.innerText = "CPU";
    elStatus.innerHTML = "MODE: CPU";
    isOnline = false;
    isHost = true;
    aiEnabled = true;
    gameActive = true;
    
    ball.reset(); p1.reset(); p2.reset();
    startMatchCountdown();
}


window.returnToMenu = function() {
    gameActive = false; isOnline = false;
    if(peer) peer.destroy();
    document.getElementById('main-ui').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
    score1 = 0; score2 = 0;
    elScore1.innerText = 0; elScore2.innerText = 0;
}


// --- Main Input Handlers ---
window.addEventListener('mousedown', (e) => { mouse.down = true; });
window.addEventListener('mouseup', () => { mouse.down = false; });
window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
});


window.addEventListener('keydown', e => {
    if (rebindState) {
        if (rebindState.player === 1) P1_KEYS[rebindState.action] = e.code;
        else P2_KEYS[rebindState.action] = e.code;
        
        localStorage.setItem('gsr_p1_keys', JSON.stringify(P1_KEYS));
        localStorage.setItem('gsr_p2_keys', JSON.stringify(P2_KEYS));
        
        rebindState = null;
        document.getElementById('keybind-status').innerText = "Bind updated successfully.";
        renderKeybinds();
        e.preventDefault();
        return;
    }


    if(!gameActive) return; 
    if (elJoinModal.style.display === 'block') {
        if(e.code === 'Enter') document.getElementById('btn-connect').click();
        if(e.code === 'Escape') closeJoinModal();
        return; 
    }
    
    if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) e.preventDefault();
    keys[e.code] = true;
    
    if (!isOnline && gameActive) {
        if (e.code === 'ControlLeft') { 
            aiEnabled = !aiEnabled; 
            elStatus.innerHTML = aiEnabled ? "MODE: CPU" : "MODE: LOCAL"; 
            if(aiEnabled) elName2.innerText = "CPU"; else elName2.innerText = "PLAYER 2";
        }
    }
    
    if (currentState === STATE.PLAYING) {
        if (isHost || !isOnline) {
            if (e.code === P1_KEYS.zeroG) p1.toggleZeroG();
            if (e.code === P1_KEYS.dash) p1.tryDash();
            
            if (!isOnline && !aiEnabled) { 
                if (e.code === P2_KEYS.zeroG) p2.toggleZeroG(); 
                if (e.code === P2_KEYS.dash) p2.tryDash(); 
            }
        }
        if (isOnline && !isHost && conn) {
            if (e.code === P1_KEYS.zeroG) conn.send({ t: 'input', i: getClientInputState(), ev: 'toggleZeroG' });
            if (e.code === P1_KEYS.dash) conn.send({ t: 'input', i: getClientInputState(), ev: 'dash' });
        }
    }
});


window.addEventListener('keyup', e => {
    if(!gameActive) return;
    keys[e.code] = false;
    if (isHost || !isOnline) {
        if (e.code === P1_KEYS.up || e.code === P1_KEYS.down) p1.canFlipToggle = true;
        if (!isOnline && !aiEnabled && (e.code === P2_KEYS.up || e.code === P2_KEYS.down)) p2.canFlipToggle = true;
    }
});


function loop() {
    if(!gameActive) {
        drawBackground();
        requestAnimationFrame(loop);
        return;
    }
    
    frameCount++;
    drawBackground();
    
    ctx.save();
    drawForceFieldGoal(0, CONFIG.goalWidth, canvas.height, '#ff4757');
    drawForceFieldGoal(canvas.width - CONFIG.goalWidth, CONFIG.goalWidth, canvas.height, '#1e90ff');


    if (currentState === STATE.PLAYING || currentState === STATE.WAITING_SYNC || currentState === STATE.COUNTDOWN) {
        if (isOnline && isHost && conn) {
            conn.send({
                t: 'state', p1: { x: p1.x, y: p1.y, gd: p1.gravityDir, fd: p1.facingDir, zg: p1.isZeroG, wb: p1.wallBoostTimer, sg: p1.isSurging },
                p2: { x: p2.x, y: p2.y, gd: p2.gravityDir, fd: p2.facingDir, zg: p2.isZeroG, wb: p2.wallBoostTimer, sg: p2.isSurging },
                b: { x: ball.x, y: ball.y, gd: ball.gravityDir, lc: ball.lastHitColor, tr: ball.isTrapped, wb: ball.wobble },
                s: { s1: score1, s2: score2 }, st: currentState, cdMsg: elCountdown.innerText
            });
        }
        
        if (currentState === STATE.PLAYING) {
            if (isOnline && !isHost) { 
                if (conn) conn.send({ t: 'input', i: getClientInputState() }); 
            } else { 
                p1.update(); p2.update(); ball.update(); resolveCollisions(); 
            }
        }
        
        p1.draw(ctx); p2.draw(ctx); ball.draw(ctx);
        if (shake > 0) { ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake *= 0.9; if (shake < 0.5) shake = 0; }
    }


    ctx.restore();
    
    // Draw screen flash on top of the game
    if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        screenFlash -= 0.05;
    }


    for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); particles[i].draw(ctx); if (particles[i].life <= 0) particles.splice(i, 1); }
    requestAnimationFrame(loop);
}
loop();
</script>
